# LoadBundle
LoadBundle_Description=Load bundle
LoadBundle_DisplayName=Load bundle
LoadBundle_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
LoadBundle_attributes_DisplayName=Attributes Map
LoadBundle_basename_Description=Base name of the resource bundle to be loaded.
LoadBundle_basename_DisplayName=
LoadBundle_childCount_Description=The number of child components associated with this component.
LoadBundle_childCount_DisplayName=Child Component Count
LoadBundle_children_Description=A mutable List of the child components associated with this component.
LoadBundle_children_DisplayName=Child Component List
LoadBundle_converter_Description=Converter instance registered with this component.
LoadBundle_converter_DisplayName=Converter
LoadBundle_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
LoadBundle_facets_DisplayName=Facets Map
LoadBundle_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
LoadBundle_family_DisplayName=Component Family
LoadBundle_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
LoadBundle_id_DisplayName=
LoadBundle_localValue_Description=For output components, this is the same as the "value" property. For input components, this is the most recently user-entered value, which will be pushed to the application data model during Update Model Values phase, if a value binding is present for the "value" property.
LoadBundle_localValue_DisplayName=Local Value
LoadBundle_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
LoadBundle_parent_DisplayName=Parent Component
LoadBundle_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
LoadBundle_rendered_DisplayName=
LoadBundle_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
LoadBundle_rendererType_DisplayName=Renderer Type
LoadBundle_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
LoadBundle_rendersChildren_DisplayName=Renders Children
LoadBundle_value_Description=The current value of this component.
LoadBundle_value_DisplayName=Value
LoadBundle_var_Description=Name of a request scope attribute under which the resource bundle will be exposed.
LoadBundle_var_DisplayName=
