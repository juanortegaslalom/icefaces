SelectInputDate_popupDateFormat_Description=DEPRECATED Now one should instead use an f\:convertDateTime tag with its pattern attribute. This is the pattern of the simple date format used in the text input, when renderAsPopup \= true Also, if the <b>title</b> attribute is not specified, then <b>popupDateFormat</b> will be used to describe the date format, in the title attribute rendered on the text input field, when renderAsPopup \= true
