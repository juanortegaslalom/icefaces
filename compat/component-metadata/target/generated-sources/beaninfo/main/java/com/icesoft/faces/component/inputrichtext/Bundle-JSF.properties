InputRichText_language_Description=<p> The support of multi-language can use the following 54 languages. (e.g.) To set the French language use language\="fr" <ul> <li>Afrikaans (af)</li><li>Arabic (ar)</li><li>Basque (eu)</li><li>Bengali/Bangla (bn)</li><li>Bosnian (bs)</li><li>Bulgarian (bg)</li><li>Catalan (ca)</li><li>Chinese Simplified (zh-cn)</li><li>Chinese Traditional (zh)</li><li>Croatian (hr)</li><li>Czech (cs)</li><li>Danish (da)</li><li>Dutch (nl)</li><li>English (en)</li><li>English (Australia) (en-au)</li><li>English (Canadian) (en-ca)</li><li>English (United Kingdom) (en-gb)</li><li>Esperanto (eo)</li><li>Estonian (et)</li><li>Faroese (fo)</li><li>Finnish (fi)</li><li>French (fr)</li><li>Galician (gl)</li><li>German (de)</li><li>Greek (el)</li><li>Hebrew (he)</li><li>Hindi (hi)</li><li>Hungarian (hu)</li><li>Italian (it)</li><li>Japanese (ja)</li><li>Khmer (km)</li><li>Korean (ko)</li><li>Latvian (lv)</li><li>Lithuanian (lt)</li><li>Malay (ms)</li><li>Mongolian (mn)</li><li>Norwegian (no)</li><li>Norwegian Bokmal (nb)</li><li>Persian (fa)</li><li>Polish (pl)</li><li>Portuguese (Brazil) (pt-br)</li><li>Portuguese (Portugal) (pt)</li><li>Romanian (ro)</li><li>Russian (ru)</li><li>Serbian (Cyrillic) (sr)</li><li>Serbian (Latin) (sr-latn)</li><li>Slovak (sk)</li><li>Slovenian (sl)</li><li>Spanish (es)</li><li>Swedish (sv)</li><li>Thai (th)</li><li>Turkish (tr)</li><li>Ukrainian (uk)</li><li>Vietnamese (vi)</li> </ul> </p>
InputRichText_language_DisplayName=
InputRichText_localValueSet_Description=Flag indicating whether the "localValue" property of this component has been set. This property is reset automatically when the "value" propertyis set.
InputRichText_localValueSet_DisplayName=Local Value Set
InputRichText_localValue_Description=For output components, this is the same as the "value" property. For input components, this is the most recently user-entered value, which will be pushed to the application data model during Update Model Values phase, if a value binding is present for the "value" property.
InputRichText_localValue_DisplayName=Local Value
InputRichText_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
InputRichText_parent_DisplayName=Parent Component
InputRichText_partialSubmit_Description=Whether a full or partialSubmit is used by the save button on the toolbar. partialSubmit won't be used when saveOnSubmit\=true. Default value is false.
InputRichText_partialSubmit_DisplayName=
InputRichText_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
InputRichText_rendered_DisplayName=
InputRichText_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
InputRichText_rendererType_DisplayName=Renderer Type
InputRichText_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
InputRichText_rendersChildren_DisplayName=Renders Children
InputRichText_requiredMessage_Description=A ValueExpression enabled attribute that, if present, will be used as the text of the validation message for the "required" facility, if the "required" facility is used.
InputRichText_requiredMessage_DisplayName=
InputRichText_required_Description=Flag indicating that the user is required to provide a submitted value for this input component.
InputRichText_required_DisplayName=
InputRichText_saveOnSubmit_Description=By default the data of the inputRichText will only be saved, when its "save" button being clicked. Any other submit request will not save its data. In order to save its data on any submit request like inputText does, this attribute can be set to true.
InputRichText_saveOnSubmit_DisplayName=
InputRichText_skin_Description=<p> The following skins can be set to the component. <ul> <li> default (other synonyms silver, v2)</li> <li> office2003 </li> <li> kama </li> </ul> </p>
InputRichText_skin_DisplayName=
InputRichText_styleClass_Description=Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup. <br/><br/> The base name for all style classes. Default value is iceInpRchTxt
InputRichText_styleClass_DisplayName=
InputRichText_style_Description=CSS style(s) to be applied when this component is rendered.
InputRichText_style_DisplayName=
InputRichText_submittedValue_Description=The value submitted for this input component by the user, prior to any required conversion or validation.
InputRichText_submittedValue_DisplayName=Submitted Value
InputRichText_toolbar_Description=There are two valid values for this field and its case sensitive. <ul> <li> Default </li> <li> Basic </li> </ul>
InputRichText_toolbar_DisplayName=
InputRichText_validatorMessage_Description=A ValueExpression enabled attribute that, if present, will be used as the text of the validator message, replacing any message that comes from the validator.
InputRichText_validatorMessage_DisplayName=Validator Message
InputRichText_validator_Description=MethodExpression representing a validator method that will be called during Process Validations to perform correctness checks on the value of this component. The expression must evaluate to a public method that takes FacesContext, UIComponent, and Object parameters, with a return type of void.
InputRichText_validator_DisplayName=Validator
