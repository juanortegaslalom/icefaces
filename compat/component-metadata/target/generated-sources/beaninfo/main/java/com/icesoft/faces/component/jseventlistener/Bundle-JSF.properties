# JSEventListener
JSEventListener_Description=
JSEventListener_DisplayName=JSEventListener
JSEventListener_actionListener_Description=MethodBinding representing an action listener method that will be notified when this component is activated by the user. The expression must evaluate to a public method that takes an ActionEvent parameter, with a return type of void.
JSEventListener_actionListener_DisplayName=
JSEventListener_action_Description=MethodBinding representing the application action to invoke when this component is activated by the user. The expression must evaluate to a either a String or a public method that takes no parameters, and returns a String (the logical outcome) which is passed to the NavigationHandler for this application.
JSEventListener_action_DisplayName=
JSEventListener_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
JSEventListener_attributes_DisplayName=Attributes Map
JSEventListener_childCount_Description=The number of child components associated with this component.
JSEventListener_childCount_DisplayName=Child Component Count
JSEventListener_children_Description=A mutable List of the child components associated with this component.
JSEventListener_children_DisplayName=Child Component List
JSEventListener_events_Description=List of "," separated events (e.g) events\="click[, keydown, ...]".
JSEventListener_events_DisplayName=
JSEventListener_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
JSEventListener_facets_DisplayName=Facets Map
JSEventListener_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
JSEventListener_family_DisplayName=Component Family
JSEventListener_handler_Description=Its an optional attribute. Can be used to define a callback handlers for the events listed in "events" attribute(e.g.) <br/> &lt;ice\:jsEventListener events\="click" handler\="myClickHandler"&gt;<br/> .... <br/><br/> &lt;ice\:jsEventListener events\="click, keydown" handler\="myHandler"&gt;<br/> ....
JSEventListener_handler_DisplayName=
JSEventListener_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
JSEventListener_id_DisplayName=Component Identifier
JSEventListener_immediate_Description=Flag indicating that this component's value must be converted and validated immediately (that is, during Apply Request Values phase), rather than waiting until Process Validations phase.
JSEventListener_immediate_DisplayName=
JSEventListener_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
JSEventListener_parent_DisplayName=Parent Component
JSEventListener_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
JSEventListener_rendered_DisplayName=Rendered Flag
JSEventListener_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
JSEventListener_rendererType_DisplayName=Renderer Type
JSEventListener_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
JSEventListener_rendersChildren_DisplayName=Renders Children
JSEventListener_styleClass_Description=Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup. <br/>
JSEventListener_styleClass_DisplayName=
JSEventListener_style_Description=CSS style(s) to be applied when this component is rendered.
JSEventListener_style_DisplayName=
JSEventListener_value_Description=The current value of this component.
JSEventListener_value_DisplayName=Value
