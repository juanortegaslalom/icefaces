# MenuBar
MenuBar_Description=A menu bar providing popup nested child menus
MenuBar_DisplayName=Menu Bar
MenuBar_actionListener_Description=MethodBinding representing an action listener method that will be notified when this component is activated by the user. The expression must evaluate to a public method that takes an ActionEvent parameter, with a return type of void.
MenuBar_actionListener_DisplayName=
MenuBar_action_Description=MethodBinding representing the application action to invoke when this component is activated by the user. The expression must evaluate to a either a String or a public method that takes no parameters, and returns a String (the logical outcome) which is passed to the NavigationHandler for this application.
MenuBar_action_DisplayName=
MenuBar_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
MenuBar_attributes_DisplayName=Attributes Map
MenuBar_childCount_Description=The number of child components associated with this component.
MenuBar_childCount_DisplayName=Child Component Count
MenuBar_children_Description=A mutable List of the child components associated with this component.
MenuBar_children_DisplayName=Child Component List
MenuBar_displayOnClick_Description=<p> By default the sub menus are being displayed on the hover event. which can be replaced with the click event by setting this attribute to true.</p>
MenuBar_displayOnClick_DisplayName=
MenuBar_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
MenuBar_facets_DisplayName=Facets Map
MenuBar_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
MenuBar_family_DisplayName=Component Family
MenuBar_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
MenuBar_id_DisplayName=
MenuBar_imageDir_Description=Set directory for location of the tree images. Default directory is /xmlhttp/css/xp/css-images/ which is include in the icefaces.jar.
MenuBar_imageDir_DisplayName=
MenuBar_immediate_Description=Flag indicating that this component's value must be converted and validated immediately (that is, during Apply Request Values phase), rather than waiting until Process Validations phase.
MenuBar_immediate_DisplayName=
MenuBar_keyboardNavigationEnabled_Description=Enables keyboard support, default value is true.
MenuBar_keyboardNavigationEnabled_DisplayName=
MenuBar_noIcons_Description=If true, this component will not rendered icons and icon spacers in menuItems. The default is false. By default icons are rendered.
MenuBar_noIcons_DisplayName=
MenuBar_orientation_Description=Defines the orientation of the top-level menu items, whether they are layed out in a horizontal or vertical fashion. When horizontal, sub menus appear below, and when vertical they appear to the side. The default is horizontal.
MenuBar_orientation_DisplayName=
MenuBar_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
MenuBar_parent_DisplayName=Parent Component
MenuBar_renderedOnUserRole_Description=If user is in given role, this component will be rendered normally. If not, nothing is rendered and the body of this tag will be skipped.
MenuBar_renderedOnUserRole_DisplayName=
MenuBar_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
MenuBar_rendered_DisplayName=
MenuBar_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
MenuBar_rendererType_DisplayName=Renderer Type
MenuBar_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
MenuBar_rendersChildren_DisplayName=Renders Children
MenuBar_scrollableDivMode_Description=<p> By default (false) the sub menus positions are adjusted properly when in scrollable browser window. When set to true, sub menus positions are adjusetd in scrollable divs but not in scrollable browser window.</p>
MenuBar_scrollableDivMode_DisplayName=
MenuBar_styleClass_Description=Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup.<br/> The base name for all style classes. Default value is <b>iceMnuBar</b></p> if enabled + horizontal <ul> <li>iceMnuBar</li> <li>iceMnuBarItem</li> <li>iceMnuBarItemLabel</li> <li>iceMnuBarItemImage</li> <li>iceMnuBarSubMenu</li> <li>iceMnuBarSubMenuInd</li> </ul> if enabled + vertical <ul> <li>iceMnuBarVrt</li> <li>iceMnuBarVrtItem</li> <li>iceMnuBarVrtItemLabel</li> <li>iceMnuBarVrtItemImage</li> <li>iceMnuBarVrtSubMenu</li> <li>iceMnuBarVrtSubMenuInd</li> </ul> if disabled + horizontal <ul> <li>iceMnuBar-dis</li> <li>iceMnuBarItem-dis</li> <li>iceMnuBarItemLabel-dis</li> <li>iceMnuBarItemImage-dis</li> <li>iceMnuBarSubMenu-dis</li> <li>iceMnuBarSubMenuInd-dis</li> </ul> if disabled + vertical <ul> <li>iceMnuBarVrt-dis</li> <li>iceMnuBarVrtItem-dis</li> <li>iceMnuBarVrtItemLabel-dis</li> <li>iceMnuBarVrtItemImage-dis</li> <li>iceMnuBarVrtSubMenu-dis</li> <li>iceMnuBarVrtSubMenuInd-dis</li> </ul>
MenuBar_styleClass_DisplayName=
MenuBar_style_Description=CSS style(s) to be applied when this component is rendered.
MenuBar_style_DisplayName=
MenuBar_value_Description=The current value of this component.
MenuBar_value_DisplayName=Value

