OutputProgress_styleClass_Description=<p> Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup.<br/> <p>Defines the base class name for all style classes used. Default value is <b>iceOutProg</b></p> <ul> <li>iceOutProg</li> <li>iceOutProgBg</li> <li>iceOutProgTxt</li> </ul> The main div which shows progress bar renderes out different style classes depending on the mode\:<br/><br/> Standard Mode\: <ul> <li>iceOutProgFill</li> </ul> Indeterminate Mode\: <ul> <li>iceOutProgIndetActv (during the progress)</li> <li>iceOutProgIndetInactv (progress finished)</li> </ul> </p>
