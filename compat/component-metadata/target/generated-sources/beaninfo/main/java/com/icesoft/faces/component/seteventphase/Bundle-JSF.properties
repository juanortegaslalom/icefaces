# SetEventPhase
SetEventPhase_Description=Changes the phase that events will be broadcast in, for events originating from components in its child hierarchy.
SetEventPhase_DisplayName=Set Event Phase
SetEventPhase_attributes_Description=
SetEventPhase_attributes_DisplayName=
SetEventPhase_childCount_Description=
SetEventPhase_childCount_DisplayName=
SetEventPhase_children_Description=
SetEventPhase_children_DisplayName=
SetEventPhase_disabled_Description=Disable the altering of event phases. This will not disable child input components, though.
SetEventPhase_disabled_DisplayName=
SetEventPhase_events_Description=The types of events that should be changed to be broadcasted in the different phase. Specified as a space delimited list of event class names. If a short version of the class name is given, without a package name, then "javax.faces.event" will be assumed. An event will be determined to match the entries in this property if it passes the instanceof test, meaning that if it is exactly that class, or is a subclass. If all events should have their phase changed, simply specify FacesEvent as the value of this property.
SetEventPhase_events_DisplayName=
