SelectInputText_validator_DisplayName=
SelectInputText_valueChangeListener_Description=MethodBinding representing a value change listener method that will be notified when a new value has been set for this input component. The expression must evaluate to a public method that takes a ValueChangeEvent parameter, with a return type of void.
SelectInputText_valueChangeListener_DisplayName=
SelectInputText_value_Description=<p>The current value of this component.</p> <p>All UIInput derived UIComponents, that are placed within a UIData container, such as a dataTable or panelSeries, should have their <i>value</i> attribute bound to a bean property via a ValueBinding/ValueExpression, since otherwise the UIData container will not keep their successfully validated state, which can cause the component to fail to function properly.</p>
SelectInputText_value_DisplayName=
SelectInputText_visible_Description=Set the visibility of this component. When false CSS style is set to display\:none
SelectInputText_visible_DisplayName=
SelectInputText_width_Description=Sets the width of both, inputText and associated drop down list.
SelectInputText_width_DisplayName=Table Width
