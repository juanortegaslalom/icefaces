SelectInputText_textChangeListener_Description=<p>MethodBinding behaving similarly to valueChangeListener. The target bean method will receive an argument of type com.icesoft.faces.component.selectinputtext.TextChangeEvent, which is a subclass of ValueChangeEvent. The new value in the event is the submittedValue of the SelectInputText component.</p> <p>The purpose of textChangeListener is to notify when the user has manually typed in text into the SelectInputText component, as opposed to selecting a list entry. This way, the application can refine the selection list, from the entered text.</p> <p>The MethodBinding is invoked in the APPLY_REQUEST_VALUES phase, much like RowSelector's selectionListener, allowing for the bean method to call FacesContext.getCurrentInstance().renderResponse(), and keep validation from happenning, on partially inputted text which would be known to fail validation.</p>
SelectInputText_textChangeListener_DisplayName=
