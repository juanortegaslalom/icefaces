SelectInputText_options_Description=<p> The value of this attribute will be passed to the "options" param of the Autocompleter.js. Which allows to set different options to the autoCompleter object. For example the server call delay frequency can be changed to 100 Milliseconds (e.g.)<br/> &nbsp;&nbsp;&lt;ice\:selectInputText options\="{frequency\:0.1}" ... &gt;<br/> The default delay is 0.4 Seconds (400 Milliseconds)<br/> Please see the scriptaculous doc to find out more options that can be set.
