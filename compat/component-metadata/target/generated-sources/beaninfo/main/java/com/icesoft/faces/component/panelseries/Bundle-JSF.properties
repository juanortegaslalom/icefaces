# PanelSeries
PanelSeries_Description=Dynamically generates a series of repeating child-components within a panel
PanelSeries_DisplayName=Panel Series
PanelSeries_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
PanelSeries_attributes_DisplayName=Attributes Map
PanelSeries_childCount_Description=The number of child components associated with this component.
PanelSeries_childCount_DisplayName=Child Component Count
PanelSeries_children_Description=A mutable List of the child components associated with this component.
PanelSeries_children_DisplayName=Child Component List
PanelSeries_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
PanelSeries_facets_DisplayName=Facets Map
PanelSeries_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
PanelSeries_family_DisplayName=Component Family
PanelSeries_first_Description=Zero-relative row number of the first row to be displayed. If this property is set to zero, rendering will begin with the first row of the underlying data.
PanelSeries_first_DisplayName=
PanelSeries_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
PanelSeries_id_DisplayName=
PanelSeries_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
PanelSeries_parent_DisplayName=Parent Component
PanelSeries_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
PanelSeries_rendered_DisplayName=
PanelSeries_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
PanelSeries_rendererType_DisplayName=Renderer Type
PanelSeries_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
PanelSeries_rendersChildren_DisplayName=Renders Children
PanelSeries_rowAvailable_Description=Flag indicating whether there is model data available for the row selected by the current value of the "rowIndex" property.
PanelSeries_rowAvailable_DisplayName=Row Available Flag
PanelSeries_rowCount_Description=The number of rows of model data that are available for processing by this component. If the number of rows is unknown, this property will be set to -1.
PanelSeries_rowCount_DisplayName=Row Count
PanelSeries_rowData_Description=An object representing the model data for the row selected by the current value of the "rowIndex" property.
PanelSeries_rowData_DisplayName=Row Data
PanelSeries_rowIndex_Description=Zero-relative index of the currently selected row from the underlying model data. No error will occur if this property is set to point at a row for which no model data exists. To ensure data availability, check the state of the "rowAvailable" property after modifying this property.
PanelSeries_rowIndex_DisplayName=Row Index
PanelSeries_rowStatePreserved_Description=<span class\="changed_added_2_1">Boolean flag directing how the per-row component state should be handled.</span>
PanelSeries_rowStatePreserved_DisplayName=Preserve Row Component State
PanelSeries_rows_Description=The number of rows to display, starting with the one identified by the "first" property. If this value is set to zero, all available rows in the underlying data model will be displayed.
PanelSeries_rows_DisplayName=
PanelSeries_styleClass_Description=<p> Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup. <br/> The default class would be rendered as <b>icePnlSrs</b> </p>
PanelSeries_styleClass_DisplayName=
PanelSeries_style_Description=CSS style(s) to be applied when this component is rendered.
PanelSeries_style_DisplayName=
PanelSeries_value_Description=The data model for this component.
PanelSeries_value_DisplayName=
PanelSeries_varStatus_Description=<p>Name of a request-scope attribute under which the current indexed state will be exposed. This is modeled after the Facelets JSTL c\:forEach varStatus. The varStatus object has 5 sub-properties\:</p> <dl> <dt>int <b>begin</b></dt> <dd>Corresponds to the UIData container's <b>first</b> property, the index at which it begins iteration.</dd> <dt>int <b>end</b></dt> <dd>The ending index of iteration, corresponding to the UIData container's <b>first</b> plus <b>rows</b> minus 1. Note\: If the UIData's DataModel's isRowAvailable() method returns false, prematurely ending iteration, then the actual ending index may not equal the value for this <b>end</b> property.</dd> <dt>int <b>index</b></dt> <dd>The current iteration index. Corresponding to the UIData container's getRowIndex() value, which also corresponds with the UIData's DataModel's getRowIndex() value.</dd> <dt>boolean <b>first</b></dt> <dd>Defined simply as\: <b>varStatus.index \=\= varStatus.begin</b></dd> <dt>boolean <b>last</b></dt> <dd>Defined simply as\: <b>varStatus.index \=\= varStatus.end</b>. Note\: This has the same limitations as the <b>end</b> property.</dd>
PanelSeries_varStatus_DisplayName=
PanelSeries_var_Description=Name of a request-scope attribute under which the model data for the row selected by the current value of the "rowIndex" property (i.e. also the current value of the "rowData" property) will be exposed.
PanelSeries_var_DisplayName=

