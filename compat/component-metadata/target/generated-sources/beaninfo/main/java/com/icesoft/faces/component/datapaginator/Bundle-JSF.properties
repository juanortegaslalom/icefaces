# DataPaginator
DataPaginator_Description=Provides a paginated view and navigation facets for a DataTable
DataPaginator_DisplayName=Data Paginator
DataPaginator_actionListener_Description=MethodBinding representing an action listener method that will be notified when the paginator would be clicked.
DataPaginator_actionListener_DisplayName=
DataPaginator_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
DataPaginator_attributes_DisplayName=Attributes Map
DataPaginator_childCount_Description=The number of child components associated with this component.
DataPaginator_childCount_DisplayName=Child Component Count
DataPaginator_children_Description=A mutable List of the child components associated with this component.
DataPaginator_children_DisplayName=Child Component List
DataPaginator_disabled_Description=Flag indicating that this element must never receive focus or be included in a subsequent submit.
DataPaginator_disabled_DisplayName=
DataPaginator_displayedRowsCountVar_Description=A parameter name, under which the actual displayed rows count is set in request scope similar to the var parameter.
DataPaginator_displayedRowsCountVar_DisplayName=
DataPaginator_enabledOnUserRole_Description=If user is in given role, this component will be rendered normally. If not, the component will be in disabled state.
DataPaginator_enabledOnUserRole_DisplayName=
DataPaginator_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
DataPaginator_facets_DisplayName=Facets Map
DataPaginator_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
DataPaginator_family_DisplayName=Component Family
DataPaginator_fastStep_Description=step (pages) used for fastforward and fastrewind.
DataPaginator_fastStep_DisplayName=
DataPaginator_firstRowIndexVar_Description=A parameter name, under which the actual first displayed row index is set in request scope similar to the var parameter.
DataPaginator_firstRowIndexVar_DisplayName=
DataPaginator_for_Description=Id of the dataTable.
DataPaginator_for_DisplayName=
DataPaginator_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
DataPaginator_id_DisplayName=
DataPaginator_immediate_Description=True means, that the default ActionListener should be executed immediately (i.e. during Apply Request Values phase of the request processing lifecycle) , rather than waiting until the Invoke Application phase.
DataPaginator_immediate_DisplayName=
DataPaginator_keyboardNavigationEnabled_Description=<p> Enables keyboard support. Default value is true. When true it enables the following keys\: Home, End, PageUp and PageDown to navigate to First, Last, Previous and Next page respectively.<br/> <b>Note\:</b> Shortcut keys would only be processed when focus is on one of a paginator button or focus is on one of a row in the datatable when keyboardNavigationEnabled is true on rowSelector as well. </p>
DataPaginator_keyboardNavigationEnabled_DisplayName=
DataPaginator_lastRowIndexVar_Description=A parameter name, under which the actual last displayed row index is set in request scope similar to the var parameter.
DataPaginator_lastRowIndexVar_DisplayName=
DataPaginator_layout_Description=The type of layout markup to use when rendering this group. If the value is "block" the renderer must produce an HTML "div" element. Otherwise HTML "span" element must be produced.
DataPaginator_layout_DisplayName=Layout
DataPaginator_pageCountVar_Description=A parameter name, under which the actual page count is set in request scope similar to the var parameter.
DataPaginator_pageCountVar_DisplayName=
DataPaginator_pageIndexVar_Description=A parameter name, under which the actual page index is set in request scope similar to the var parameter.
DataPaginator_pageIndexVar_DisplayName=
DataPaginator_paginatorMaxPages_Description=The maximum amount of pages to be displayed in the paginator.
DataPaginator_paginatorMaxPages_DisplayName=
DataPaginator_paginator_Description=If set true, then the page number links will be rendered.
DataPaginator_paginator_DisplayName=
DataPaginator_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
DataPaginator_parent_DisplayName=Parent Component
DataPaginator_renderFacetsIfSinglePage_Description=If set to false, then the data scroller will not be rendered when only a single page of data exists.
DataPaginator_renderFacetsIfSinglePage_DisplayName=
DataPaginator_renderedOnUserRole_Description=If user is in given role, this component will be rendered normally. If not, nothing is rendered and the body of this tag will be skipped.
DataPaginator_renderedOnUserRole_DisplayName=
DataPaginator_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
DataPaginator_rendered_DisplayName=
DataPaginator_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
DataPaginator_rendererType_DisplayName=Renderer Type
DataPaginator_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
DataPaginator_rendersChildren_DisplayName=Renders Children
DataPaginator_rowsCountVar_Description=A parameter name, under which the actual rows count is set in request scope similar to the var parameter.
DataPaginator_rowsCountVar_DisplayName=
DataPaginator_styleClass_Description=<p> Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup.<br/> Default value is <b>iceDatPgr<b/></p> if enabled <ul> <li>iceDatPgrScrBtn</li> <li>iceDatPgrScrOut</li> <li>iceDatPgrSrcCol</li> <li>iceDatPgrCol</li> <li>iceDatPgrTbl</li> </ul> if disabled <ul> <li>iceDatPgrScrBtn-dis</li> <li>iceDatPgrScrOut-dis</li> <li>iceDatPgrSrcCol-dis</li> <li>iceDatPgrCol-dis</li> <li>iceDatPgrTbl-dis</li> </ul>
DataPaginator_styleClass_DisplayName=
DataPaginator_style_Description=CSS style(s) to be applied when this component is rendered.
DataPaginator_style_DisplayName=
DataPaginator_tabindex_Description=Position of this element in the tabbing order for the current document. This value must be an integer between 0 and 32767.
DataPaginator_tabindex_DisplayName=
DataPaginator_vertical_Description=True means, that the padinatior would render vertically, default is false.
DataPaginator_vertical_DisplayName=
