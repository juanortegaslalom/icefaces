# CommandSortHeader
CommandSortHeader_Description=Provides a column sorting header facet for a Data Table
CommandSortHeader_DisplayName=Command Sort Header
CommandSortHeader_actionListener_Description=<p> MethodExpression representing an action listener method that will be notified when this component is activated by the user. The expression must evaluate to a public method that takes an ActionEvent parameter, with a return type of void, <span class\="changed_added_2_0">or to a public method that takes no arguments with a return type of void. In the latter case, the method has no way of easily knowing where the event came from, but this can be useful in cases where a notification is needed that "some action happened".</span> </p>
CommandSortHeader_actionListener_DisplayName=Action Listener
CommandSortHeader_action_Description=MethodBinding representing the application action to invoke when this component is activated by the user. The expression must evaluate to a either a String or a public method that takes no parameters, and returns a String (the logical outcome) which is passed to the NavigationHandler for this application.
CommandSortHeader_action_DisplayName=Application Action
CommandSortHeader_arrow_Description=Indicates whether an arrow, that shows the sort direction should be rendered. Default\: false <br/> Note\: This is deprecated. It no longer has any effect in 1.7. To alter the appearance of the arrow images, the following style classes need to be customized\: <ul> <li>iceCmdSrtHdrAsc</li> <li>iceCmdSrtHdrDesc</li> </ul>
CommandSortHeader_arrow_DisplayName=
CommandSortHeader_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
CommandSortHeader_attributes_DisplayName=Attributes Map
CommandSortHeader_childCount_Description=The number of child components associated with this component.
CommandSortHeader_childCount_DisplayName=Child Component Count
CommandSortHeader_children_Description=A mutable List of the child components associated with this component.
CommandSortHeader_children_DisplayName=Child Component List
CommandSortHeader_columnName_Description=The name of this column. This name must uniquely identify this column among all other (sortable) columns in the same data_table. The sortColumn attribute of the embedding data_table reflects the current sort column (see extended data_table).
CommandSortHeader_columnName_DisplayName=
CommandSortHeader_disabled_Description=Flag indicating that this element must never receive focus or be included in a subsequent submit.
CommandSortHeader_disabled_DisplayName=
CommandSortHeader_enabledOnUserRole_Description=If user is in given role, this component will be rendered normally. If not, the component will be in disabled state.
CommandSortHeader_enabledOnUserRole_DisplayName=
CommandSortHeader_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
CommandSortHeader_facets_DisplayName=Facets Map
CommandSortHeader_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
CommandSortHeader_family_DisplayName=Component Family
CommandSortHeader_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
CommandSortHeader_id_DisplayName=
CommandSortHeader_immediate_Description=Flag indicating that this component's value must be converted and validated immediately (that is, during Apply Request Values phase), rather than waiting until Process Validations phase.
CommandSortHeader_immediate_DisplayName=
CommandSortHeader_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
CommandSortHeader_parent_DisplayName=Parent Component
CommandSortHeader_renderedOnUserRole_Description=If user is in given role, this component will be rendered normally. If not, nothing is rendered and the body of this tag will be skipped.
CommandSortHeader_renderedOnUserRole_DisplayName=
CommandSortHeader_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
CommandSortHeader_rendered_DisplayName=
CommandSortHeader_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
CommandSortHeader_rendererType_DisplayName=Renderer Type
CommandSortHeader_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
CommandSortHeader_rendersChildren_DisplayName=Renders Children
CommandSortHeader_styleClass_Description=The base name for all style classes. Default value is <b>iceCmdSrtHdr</b> if enabled and <b>iceCmdSrtHdr-dis</b> if disabled.
CommandSortHeader_styleClass_DisplayName=
CommandSortHeader_value_Description=The current value of this component.
CommandSortHeader_value_DisplayName=Value
