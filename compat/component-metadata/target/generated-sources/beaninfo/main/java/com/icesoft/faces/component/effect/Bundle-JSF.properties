ApplyEffect_effectType_Description=<table> <tr><td>effectType</td><td>Description</td><td>Options</td></tr> <tr> <td>appear</td> <td>Fade in an element from hidden to visiable</td> <td> <table> <tr> <th>option</th> <th>Description</th> <th>Default Value</th> </tr> <tr> <td>from</td> <td>Starting opacity</td> <td>0.0</td> </tr> <tr> <td>to</td> <td>Ending opacity</td> <td>1.0</td> </tr> </table> </td> <tr> <td>fade</td> <td>Fade out an element from visiable to hidden</td> <td> <table> <tr> <th>option</th> <th>Description</th> <th>Default Value</th> </tr> <tr> <td>from</td> <td>Starting opacity</td> <td>1.0</td> </tr> <tr> <td>to</td> <td>Ending opacity</td> <td>0.0</td> </tr> </table> </td> </tr> <tr> <td>highlight</td> <td>Highlight an element in a specifed color, the fade to the backgroud color</td> <td> <table> <tr> <th>option</th> <th>Description</th> <th>Default Value</th> </tr> <tr> <td>startcolor</td> <td>Highlight color</td> <td>"\#ffff99"</td> </tr> </table> </td> </tr> <tr> <td>pulsate</td> <td>Flash an element</td> <td> None </td> </tr> <tr> <td>scale</td> <td>Change the dimenstions of an element</td> <td> <table> <tr> <th>option</th> <th>Description</th> <th>Default Value</th> </tr> <tr> <td>scaleX</td> <td>Scale X</td> <td>true</td> </tr> <tr> <td>scaleY</td> <td>Scale Y</td> <td>true</td> </tr> <tr> <td>scaleContent</td> <td>scale Content</td> <td>true</td> </tr> <tr> <td>scaleFromCenter</td> <td>scale From Center</td> <td>true</td> </tr> <tr> <td>scaleMode</td> <td>can be 'box' or 'contents' </td> <td>'box'</td> </tr> <tr> <td>scaleFrom</td> <td>Starting percent to scale from</td> <td>100.0</td> </tr> <tr> <td>scaleTo</td> <td>Ending percent to scale to</td> <td>0</td> </tr> </table> </td> </tr> <tr> <td>puff</td> <td>Grow and fade an element</td> <td> None </td> </tr> <tr> <td>blindup</td> <td>Remove an element by rolling it up</td> <td> None </td> </tr> <tr> <td>blinddown</td> <td>Show an element by rolling it down</td> <td> None </td> </tr> <tr> <td> swtichoff </td> <td>Flash and then fold the element. Removing it from the display</td> <td> None </td> </tr> <tr> <td> dropout </td> <td>Move the element down and fade. Removing it from the display</td> <td> None </td> </tr> <tr> <td> shake </td> <td>Shake an element from left to right</td> <td> None </td> </tr> <tr> <td>slidedown </td> <td>Slide an element doen from the top</td> <td> None </td> </tr> <tr> <td>slideup </td> <td>Slide an element uo to the top. Removing it from the display</td> <td> None </td> </tr> <tr> <td>squish </td> <td>Squish an element off of the display</td> <td> None </td> </tr> <tr> <td>grow </td> <td>Grow an element from hidden to its normal size</td> <td> None </td> </tr> <tr> <td>shrink </td> <td>Shrink an element off of the display</td> <td> None </td> </tr> <tr> <td>fold </td> <td>Fold and element into smaller picese, util it is removed from the diplsay</td> <td> None </td> </tr> <tr> <td>move </td> <td>Move and element to a new location</td> <td> <table> <tr> <th>option</th> <th>Description</th> <th>Default Value</th> </tr> <tr> <td>x</td> <td>New X or left position</td> <td>0</td> </tr> <tr> <td>y</td> <td>New Y or top position</td> <td>0</td> </tr> <tr> <td>mode</td> <td>relative or absoulte</td> <td>relative</td> </tr> </table> </td> </tr> <table>
