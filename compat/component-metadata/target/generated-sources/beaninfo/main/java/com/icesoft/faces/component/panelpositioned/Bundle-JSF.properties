# PanelPositioned
PanelPositioned_Description=a container for a series of repeating child components
PanelPositioned_DisplayName=Positioned Panel
PanelPositioned_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
PanelPositioned_attributes_DisplayName=Attributes Map
PanelPositioned_beforeChangedListener_Description=beforeChangedListener called before the list is changed. Which takes a PanelPositionedEvent. User can cancel event by calling cancel() on PanelPositionedEvent. If cancel() was called then the list will not be changed and the listener will not be called. (e.g.) <br/> public void methodName(PanelPositionedEvent event);
PanelPositioned_beforeChangedListener_DisplayName=
PanelPositioned_childCount_Description=The number of child components associated with this component.
PanelPositioned_childCount_DisplayName=Child Component Count
PanelPositioned_children_Description=A mutable List of the child components associated with this component.
PanelPositioned_children_DisplayName=Child Component List
PanelPositioned_constraint_Description=<p> The following are the valid values for this attribute. This attribute has an impact on the presentation of the positioned element while dragging. </p> <ul> <li> horizontal\: <br/> While dragging an item horizontally outside from the positioned panel. The draggable element can be seen moving outside, whereas with the "vertical" you can drag an element outside but the draggable elemement doesn't go out of its container.</li> <li> vertical\: <br/> While dragging an item vertically, the item underneath it moves up or down smoothly with slide effect and makes an empty space for the draggaed item, whereas in horizontal mode you don't see the slide effect</li> <li> false\: <br/> You can drag the positioned element vertically or horizontally but you don't see any slide effect as well as the draggable element doesn't go outside of its panel. </li> </ul>
PanelPositioned_constraint_DisplayName=
PanelPositioned_disabled_Description=Flag indicating that this element must never receive focus or be included in a subsequent submit.
PanelPositioned_disabled_DisplayName=
PanelPositioned_enabledOnUserRole_Description=If user is in given role, this component will be rendered normally. If not, the component will be in disabled state.
PanelPositioned_enabledOnUserRole_DisplayName=
PanelPositioned_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
PanelPositioned_facets_DisplayName=Facets Map
PanelPositioned_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
PanelPositioned_family_DisplayName=Component Family
PanelPositioned_first_Description=Note\: This is deprecated.<br/>
PanelPositioned_first_DisplayName=
PanelPositioned_handle_Description=The css class of a child node that is used to drag the item. (e.g.)<br/> &lt;ice\:panelPositioned var\="person" <br/> value\="\#{panelPositioned.people}" handle\="personClass" &gt;<br/> &lt;ice\:panelGroup &gt;<br/> &lt;ice\:outputText style\="cursor\:move;" styleClass\="personClass" value\="drag \#{person.name}"/&gt;<br/> &lt;ice\:outputText value\="this panel can only be dragged by the person name."/&gt;<br/> &lt;/ice\:panelGroup&gt;<br/> &lt;/ice\:panelPositioned&gt; <br/>
PanelPositioned_handle_DisplayName=
PanelPositioned_hoverclass_Description=Note\: This is deprecated.<br/>
PanelPositioned_hoverclass_DisplayName=
PanelPositioned_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
PanelPositioned_id_DisplayName=
PanelPositioned_listener_Description=Listener, called when list is changed. Which takes a PanelPositionedEvent. (e.g.) <br/> public void methodName(PanelPositionedEvent event);
PanelPositioned_listener_DisplayName=
PanelPositioned_overlap_Description=Note\: This is deprecated. <br/>
PanelPositioned_overlap_DisplayName=
PanelPositioned_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
PanelPositioned_parent_DisplayName=Parent Component
PanelPositioned_renderedOnUserRole_Description=If user is in given role, this component will be rendered normally. If not, nothing is rendered and the body of this tag will be skipped.
PanelPositioned_renderedOnUserRole_DisplayName=
PanelPositioned_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
PanelPositioned_rendered_DisplayName=
PanelPositioned_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
PanelPositioned_rendererType_DisplayName=Renderer Type
PanelPositioned_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
PanelPositioned_rendersChildren_DisplayName=Renders Children
PanelPositioned_rowAvailable_Description=Flag indicating whether there is model data available for the row selected by the current value of the "rowIndex" property.
PanelPositioned_rowAvailable_DisplayName=Row Available Flag
PanelPositioned_rowCount_Description=The number of rows of model data that are available for processing by this component. If the number of rows is unknown, this property will be set to -1.
PanelPositioned_rowCount_DisplayName=Row Count
PanelPositioned_rowData_Description=An object representing the model data for the row selected by the current value of the "rowIndex" property.
PanelPositioned_rowData_DisplayName=Row Data
PanelPositioned_rowIndex_Description=Zero-relative index of the currently selected row from the underlying model data. No error will occur if this property is set to point at a row for which no model data exists. To ensure data availability, check the state of the "rowAvailable" property after modifying this property.
PanelPositioned_rowIndex_DisplayName=Row Index
PanelPositioned_rowStatePreserved_Description=<span class\="changed_added_2_1">Boolean flag directing how the per-row component state should be handled.</span>
PanelPositioned_rowStatePreserved_DisplayName=Preserve Row Component State
PanelPositioned_rows_Description=Note\: This is deprecated.<br/>
PanelPositioned_rows_DisplayName=
PanelPositioned_styleClass_Description=<p> Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup. <br/> The default class would be rendered as <b>icePnlPos</b> </p>
PanelPositioned_styleClass_DisplayName=
PanelPositioned_style_Description=CSS style(s) to be applied when this component is rendered.
PanelPositioned_style_DisplayName=
PanelPositioned_value_Description=The data model for this component. Could be a java.util.List or an Array
PanelPositioned_value_DisplayName=
PanelPositioned_varStatus_Description=<p>Name of a request-scope attribute under which the current indexed state will be exposed. This is modeled after the Facelets JSTL c\:forEach varStatus. The varStatus object has 5 sub-properties\:</p> <dl> <dt>int <b>begin</b></dt> <dd>Corresponds to the UIData container's <b>first</b> property, the index at which it begins iteration.</dd> <dt>int <b>end</b></dt> <dd>The ending index of iteration, corresponding to the UIData container's <b>first</b> plus <b>rows</b> minus 1. Note\: If the UIData's DataModel's isRowAvailable() method returns false, prematurely ending iteration, then the actual ending index may not equal the value for this <b>end</b> property.</dd> <dt>int <b>index</b></dt> <dd>The current iteration index. Corresponding to the UIData container's getRowIndex() value, which also corresponds with the UIData's DataModel's getRowIndex() value.</dd> <dt>boolean <b>first</b></dt> <dd>Defined simply as\: <b>varStatus.index \=\= varStatus.begin</b></dd> <dt>boolean <b>last</b></dt> <dd>Defined simply as\: <b>varStatus.index \=\= varStatus.end</b>. Note\: This has the same limitations as the <b>end</b> property.</dd>
PanelPositioned_varStatus_DisplayName=
PanelPositioned_var_Description=Name of a request-scope attribute under which the model data presented for the current row.
PanelPositioned_var_DisplayName=
