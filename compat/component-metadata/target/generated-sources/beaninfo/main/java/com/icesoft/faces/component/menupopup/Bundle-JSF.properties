# MenuPopup
MenuPopup_Description=A context sensitive popup menu providing popup nested child menus
MenuPopup_DisplayName=Menu Popup
MenuPopup_actionListener_Description=MethodBinding representing an action listener method that will be notified when this component is activated by the user. The expression must evaluate to a public method that takes an ActionEvent parameter, with a return type of void.
MenuPopup_actionListener_DisplayName=
MenuPopup_action_Description=MethodBinding representing the application action to invoke when this component is activated by the user. The expression must evaluate to a either a String or a public method that takes no parameters, and returns a String (the logical outcome) which is passed to the NavigationHandler for this application.
MenuPopup_action_DisplayName=
MenuPopup_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
MenuPopup_attributes_DisplayName=Attributes Map
MenuPopup_blockMenuOnInput_Description=Setting this property to true, blocks menuPopup on input elements and shows browser default instead. Default value is false.
MenuPopup_blockMenuOnInput_DisplayName=
MenuPopup_childCount_Description=The number of child components associated with this component.
MenuPopup_childCount_DisplayName=Child Component Count
MenuPopup_children_Description=A mutable List of the child components associated with this component.
MenuPopup_children_DisplayName=Child Component List
MenuPopup_displayListener_Description=The displayListener is a MethodBinding/MethodExpression that specifies a method on a backing bean that will accept a com.icesoft.faces.component.DisplayEvent.
MenuPopup_displayListener_DisplayName=
MenuPopup_displayOnClick_Description=<p> By default the sub menus are being displayed on the hover event. which can be replaced with the click event by setting this attribute to true.</p>
MenuPopup_displayOnClick_DisplayName=
MenuPopup_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
MenuPopup_facets_DisplayName=Facets Map
MenuPopup_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
MenuPopup_family_DisplayName=Component Family
MenuPopup_hideOn_Description=<p> The following are the valid values for the hideOn attribute\: <ul> <li> mouseout </li> <li> mousedown </li> </ul> </p> <p> <h3> mouseout \:</h3> the popup menu will be hidden when the user moves the mouse out of any part of the menu. </p> <p> <h3> mousedown \:</h3> the popup menu will be hidden when the user clicks any area outside of the menu. </p>
MenuPopup_hideOn_DisplayName=
MenuPopup_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
MenuPopup_id_DisplayName=
MenuPopup_imageDir_Description=Set directory for location of the tree images. Default directory is /xmlhttp/css/xp/css-images/ which is include in the icefaces.jar.
MenuPopup_imageDir_DisplayName=
MenuPopup_immediate_Description=Flag indicating that this component's value must be converted and validated immediately (that is, during Apply Request Values phase), rather than waiting until Process Validations phase.
MenuPopup_immediate_DisplayName=
MenuPopup_keyboardNavigationEnabled_Description=Enables keyboard support, default value is true.
MenuPopup_keyboardNavigationEnabled_DisplayName=
MenuPopup_noIcons_Description=If true, this component will not rendered icons and icon spacers in menuItems. The default is false. By default icons are rendered.
MenuPopup_noIcons_DisplayName=
MenuPopup_orientation_Description=Defines the orientation of the top-level menu items. For menuPopup, the only valid orientation is vertical, where each subsequent top-level menu item is below the previous. Sub menus appear to the side.
MenuPopup_orientation_DisplayName=
MenuPopup_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
MenuPopup_parent_DisplayName=Parent Component
MenuPopup_renderedOnUserRole_Description=If user is in given role, this component will be rendered normally. If not, nothing is rendered and the body of this tag will be skipped.
MenuPopup_renderedOnUserRole_DisplayName=
MenuPopup_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
MenuPopup_rendered_DisplayName=
MenuPopup_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
MenuPopup_rendererType_DisplayName=Renderer Type
MenuPopup_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
MenuPopup_rendersChildren_DisplayName=Renders Children
MenuPopup_scrollableDivMode_Description=<p> By default (false) the sub menus positions are adjusted properly when in scrollable browser window. When set to true, sub menus positions are adjusetd in scrollable divs but not in scrollable browser window.</p>
MenuPopup_scrollableDivMode_DisplayName=
MenuPopup_styleClass_Description=Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup.<br/> The base name for all style classes. Default value is <b>iceMnuPop</b></p> if enabled <ul> <li>iceMnuPopVrt</li> <li>iceMnuPopVrtItem</li> <li>iceMnuPopVrtItemLabel</li> <li>iceMnuPopVrtItemImage</li> <li>iceMnuPopVrtSubMenu</li> <li>iceMnuPopVrtSubMenuInd</li> </ul> if disabled <ul> <li>iceMnuPopVrt-dis</li> <li>iceMnuPopVrtItem-dis</li> <li>iceMnuPopVrtItemLabel-dis</li> <li>iceMnuPopVrtItemImage-dis</li> <li>iceMnuPopVrtSubMenu-dis</li> <li>iceMnuPopVrtSubMenuInd-dis</li> </ul>
MenuPopup_styleClass_DisplayName=
MenuPopup_style_Description=CSS style(s) to be applied when this component is rendered.
MenuPopup_style_DisplayName=
MenuPopup_value_Description=The current value of this component.
MenuPopup_value_DisplayName=Value
