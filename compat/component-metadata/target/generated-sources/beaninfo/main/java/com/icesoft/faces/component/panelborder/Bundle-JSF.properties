# PanelBorder
PanelBorder_Description=Arranges and resizes child components to fit in five predefined regions (N, S, E, W, Center)
PanelBorder_DisplayName=Panel Border
PanelBorder_align_Description=Passed through to root element.
PanelBorder_align_DisplayName=
PanelBorder_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
PanelBorder_attributes_DisplayName=Attributes Map
PanelBorder_bgcolor_Description=Name or code of the background color for this table.
PanelBorder_bgcolor_DisplayName=
PanelBorder_border_Description=Width (in pixels) of the border to be drawn around this table.
PanelBorder_border_DisplayName=
PanelBorder_cellpadding_Description=Definition of how much space the user agent should leave between the border of each cell and its contents.
PanelBorder_cellpadding_DisplayName=
PanelBorder_cellspacing_Description=Definition of how much space the user agent should leave between the left side of the table and the leftmost column, the top of the table and the top of the top side of the topmost row, and so on for the right and bottom of the table. It also specifies the amount of space to leave between cells.
PanelBorder_cellspacing_DisplayName=
PanelBorder_childCount_Description=The number of child components associated with this component.
PanelBorder_childCount_DisplayName=Child Component Count
PanelBorder_children_Description=A mutable List of the child components associated with this component.
PanelBorder_children_DisplayName=Child Component List
PanelBorder_dir_Description=Direction indication for text that does not inherit directionality. Valid values are "LTR" (left-to-right) and "RTL" (right-to-left).
PanelBorder_dir_DisplayName=
PanelBorder_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
PanelBorder_facets_DisplayName=Facets Map
PanelBorder_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
PanelBorder_family_DisplayName=Component Family
PanelBorder_frame_Description=Code specifying which sides of the frame surrounding this table will be visible. Valid values are\: none (no sides, default value); above (top side only); below (bottom side only); hsides (top and bottom sides only); vsides (right and left sides only); lhs (left hand side only); rhs (right hand side only); box (all four sides); and border (all four sides).
PanelBorder_frame_DisplayName=
PanelBorder_height_Description=height of the entire table, for visual user agents.
PanelBorder_height_DisplayName=
PanelBorder_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
PanelBorder_id_DisplayName=
PanelBorder_lang_Description=Code describing the language used in the generated markup for this component.
PanelBorder_lang_DisplayName=
PanelBorder_layout_Description=layout | north | south | west | east | center | \=\=\=\=\=\=\=\=\=\=\=\=\=\=\=\=\=\=\=|\=\=\=\=\=\=\=\=|\=\=\=\=\=\=\=\=|\=\=\=\=\=\=\=|\=\=\=\=\=\=\=\=|\=\=\=\=\=\=\=\=| default | top | bottom | left | right | center | horizontal reverse | top | bottom | right | left | center | vertical reverse | bottom | top | left | right | center | center only | none | none | none | none | center | hide north | none | bottom | left | right | center | hide east | top | bottom | left | none | center | hide south | top | none | left | right | center | hide west | top | bottom | none | right | center |
PanelBorder_layout_DisplayName=
PanelBorder_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
PanelBorder_parent_DisplayName=Parent Component
PanelBorder_renderCenter_Description=If false, the center facet will not be rendered. The layout attribute overrides this property.
PanelBorder_renderCenter_DisplayName=
PanelBorder_renderEast_Description=If false, the east facet will not be rendered. The layout attribute overrides this property.
PanelBorder_renderEast_DisplayName=
PanelBorder_renderNorth_Description=If false, the north facet will not be rendered. The layout attribute overrides this property.
PanelBorder_renderNorth_DisplayName=
PanelBorder_renderSouth_Description=If false, the south facet will not be rendered. The layout attribute overrides this property.
PanelBorder_renderSouth_DisplayName=
PanelBorder_renderWest_Description=If false, the west facet will not be rendered. The layout attribute overrides this property.
PanelBorder_renderWest_DisplayName=
PanelBorder_renderedOnUserRole_Description=If user is in given role, this component will be rendered normally. If not, nothing is rendered and the body of this tag will be skipped.
PanelBorder_renderedOnUserRole_DisplayName=
PanelBorder_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
PanelBorder_rendered_DisplayName=
PanelBorder_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
PanelBorder_rendererType_DisplayName=Renderer Type
PanelBorder_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
PanelBorder_rendersChildren_DisplayName=Renders Children
PanelBorder_rules_Description=Code specifying which rules will appear between cells within this table. Valid values are\: none (no rules, default value); groups (between row groups); rows (between rows only); cols (between columns only); and all (between all rows and columns).
PanelBorder_rules_DisplayName=
PanelBorder_styleClass_Description=<p> Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup.<br/> <p>Defines the base class name for all style classes. Default value is <b>icePnlBrdr</b></p> <ul> <li>icePnlBrdrNorth</li> <li>icePnlBrdrEast</li> <li>icePnlBrdrWest</li> <li>icePnlBrdrSouth</li> <li>icePnlBrdrCenter</li> </ul> </p>
PanelBorder_styleClass_DisplayName=
PanelBorder_style_Description=CSS style(s) to be applied when this component is rendered.
PanelBorder_style_DisplayName=
PanelBorder_summary_Description=Summary of this table's purpose and structure, for user agents rendering to non-visual media such as speech and Braille.
PanelBorder_summary_DisplayName=
PanelBorder_title_Description=Advisory title information about markup elements generated for this component.
PanelBorder_title_DisplayName=
PanelBorder_width_Description=Width of the entire table, for visual user agents.
