PanelTab_styleClass_Description=<p>Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup.</p> <p>Defines the base class name for all style classes used in tabbed panes.</p> <p>Default value for the base class name is <b>icePnlTb</b>. The base class name is used as a prefix for the style classes that will be applied to the elements that make up the panelTab. The default style classes are defined in the xp.css and royale.css that are included with ICEfaces.</p> <p>There are several parts of the CSS class names, as they are defined in the CSS files\: <dl> <dt>icePnlTb</dt> <dd>The root of the class name, as set in the styleClass attribute</dd> <dt>On / Off / Over</dt> <dd>On\: If tab is the selected one. Off\: If tab is not the selected one. Over\: When mouseover the tab.</dd> <dt>Btm</dt> <dd>If the tab is on the top, then "", else if the tab is on the bottom, then "Btm"</dd> <dt>Lft / Mid / Rt</dt> <dd>For the tab, which horizonal section, as left, middle, and right.</dd> <dt>Top / Mid / Btm</dt> <dd>For the tab, which vertical section, as top, middle, and bottom.</dd> <dt>-dis</dt> <dd>If the panel is enabled, then "", else if the panel is disabled, then "-dis"</dd> </dl> <p>Put together, the various sections are\: ".{root_classname}{tab_is_On_or_Off_or_Over}{tab_on_top_or_bottom} .{horizonal_section_of_tab}{vertical_section_of_tab}{disabled}"<br/> That means there is a matrix of classes that have to be defined for the 3 possibilities of tab_is_On_or_Off_or_Over, the 2 possibilities of tab_on_top_or_bottom, the 3 values of horizonal_section_of_tab, the 3 values of vertical_section_of_tab, and the 2 possiblities for disabled, which is 3x2x3x3x2\=108 combinations.<br/> So, given the default value of styleClass as being <b>icePnlTb</b>, if you want a styling for mousing over the tab, when tabs are on the bottom, for the right top side of the tab, then you would have to define this class in your CSS file\: <b>.icePnlTbOverBtm .RtTop</b></br> And if you want a styling for the currently selected tab, when tabs are on the top, for the right middle side of the tab, and the tab is disabled, then you would have to define this class in your CSS file\: <b>.icePnlTbOn .RtMid-dis</b></br> </p>
PanelTab_styleClass_DisplayName=
