PanelTabSet_rowAvailable_Description=Flag indicating whether there is model data available for the row selected by the current value of the "rowIndex" property.
PanelTabSet_rowAvailable_DisplayName=Row Available Flag
PanelTabSet_rowClasses_Description=Comma-delimited list of CSS style classes that will be applied to the rows of this table. A space separated list of classes may also be specified for any individual row. Thes styles are applied, in turn, to each row in the table. For example, if the list has two elements, the first style class in the list is applied to the first row, the second to the second row, the first to the third row, the second to the fourth row, etc. In other words, we keep iterating through the list until we reach the end, and then we start at the beginning again.
PanelTabSet_rowClasses_DisplayName=Row CSS Classes
PanelTabSet_rowCount_Description=The number of rows of model data that are available for processing by this component. If the number of rows is unknown, this property will be set to -1.
PanelTabSet_rowCount_DisplayName=Row Count
PanelTabSet_rowData_Description=An object representing the model data for the row selected by the current value of the "rowIndex" property.
PanelTabSet_rowData_DisplayName=Row Data
PanelTabSet_rowIndex_Description=Zero-relative index of the currently selected row from the underlying model data. No error will occur if this property is set to point at a row for which no model data exists. To ensure data availability, check the state of the "rowAvailable" property after modifying this property.
PanelTabSet_rowIndex_DisplayName=Row Index
PanelTabSet_rowStatePreserved_Description=<span class\="changed_added_2_1">Boolean flag directing how the per-row component state should be handled.</span>
PanelTabSet_rowStatePreserved_DisplayName=Preserve Row Component State
PanelTabSet_rows_Description=The number of rows to display, starting with the one identified by the "first" property. If this value is set to zero, all available rows in the underlying data model will be displayed.
PanelTabSet_rows_DisplayName=
PanelTabSet_rules_Description=Code specifying which rules will appear between cells within this table. Valid values are\: none (no rules, default value); groups (between row groups); rows (between rows only); cols (between columns only); and all (between all rows and columns).
PanelTabSet_rules_DisplayName=
PanelTabSet_selectedIndex_Description=Index of tab that is selected by default.
PanelTabSet_selectedIndex_DisplayName=
PanelTabSet_styleClass_Description=<p> Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup.<br/> <p>Defines the base class name for all style classes.</p> <p>Default value for the base class name is <b>icePnlTbSet</b>. The base class name is used as a prefix for the style classes that will be applied to the elements that make up the panelTabSet. The default style classes are defined in the xp.css and royale.css that are included with ICEfaces.</p> <p>Style Classes Used\:</p> <ul> <li>icePnlTbSet</li> <li>icePnlTbSetBtm</li> <li>icePnlTbSetCnt</li> <li>icePnlTbSetCntBtm</li> <li>icePnlTbSetSpcr</li> <li>icePnlTbSetSpcrBtm</li> <li>icePnlTbSetHdrIconLft</li> <li>icePnlTbSetHdrIconRt</li> <li>icePnlTbSetHdrLbl</li> </ul> <p/> <p>To override the defaults with a base class name of <b>myTabSet</b> the developer will need to define the following styleclasses in their web applications css.</p> <ul> <li>myTabSet</li> <li>myTabSetBtm</li> <li>myTabSetCnt</li> <li>myTabSetCntBtm</li> <li>myTabSetSpcr</li> <li>myTabSetSpcrBtm</li> <li>myTabSetHdrIconLft</li> <li>myTabSetHdrIconRt</li> <li>myTabSetHdrLbl</li> </ul> <p/>
PanelTabSet_styleClass_DisplayName=
PanelTabSet_style_Description=CSS style(s) to be applied when this component is rendered.
PanelTabSet_style_DisplayName=
PanelTabSet_summary_Description=Summary of this table's purpose and structure, for user agents rendering to non-visual media such as speech and Braille.
PanelTabSet_summary_DisplayName=
PanelTabSet_tabChangeListener_Description=the name of the class that will be added to the HtmlPanelTabbedPane component as a TabChangeListener
PanelTabSet_tabChangeListener_DisplayName=
PanelTabSet_tabPlacement_Description=The placement for the tabs relative to the content. Possible values; Top, Bottom. Default is Top. Left and Right not supported in this release.
PanelTabSet_tabPlacement_DisplayName=
PanelTabSet_tabindex_Description=Position of this element in the tabbing order for the current document. This value must be an integer between 0 and 32767.
PanelTabSet_tabindex_DisplayName=
PanelTabSet_title_Description=Advisory title information about markup elements generated for this component.
PanelTabSet_title_DisplayName=
PanelTabSet_value_Description=The data model for this component.
PanelTabSet_value_DisplayName=
PanelTabSet_varStatus_Description=<p>Name of a request-scope attribute under which the current indexed state will be exposed. This is modeled after the Facelets JSTL c\:forEach varStatus. The varStatus object has 5 sub-properties\:</p> <dl> <dt>int <b>begin</b></dt> <dd>Corresponds to the UIData container's <b>first</b> property, the index at which it begins iteration.</dd> <dt>int <b>end</b></dt> <dd>The ending index of iteration, corresponding to the UIData container's <b>first</b> plus <b>rows</b> minus 1. Note\: If the UIData's DataModel's isRowAvailable() method returns false, prematurely ending iteration, then the actual ending index may not equal the value for this <b>end</b> property.</dd> <dt>int <b>index</b></dt> <dd>The current iteration index. Corresponding to the UIData container's getRowIndex() value, which also corresponds with the UIData's DataModel's getRowIndex() value.</dd> <dt>boolean <b>first</b></dt> <dd>Defined simply as\: <b>varStatus.index \=\= varStatus.begin</b></dd> <dt>boolean <b>last</b></dt> <dd>Defined simply as\: <b>varStatus.index \=\= varStatus.end</b>. Note\: This has the same limitations as the <b>end</b> property.</dd>
PanelTabSet_varStatus_DisplayName=
PanelTabSet_var_Description=Name of a request-scope attribute under which the model data for the row selected by the current value of the "rowIndex" property (i.e. also the current value of the "rowData" property) will be exposed.
PanelTabSet_var_DisplayName=
PanelTabSet_visible_Description=Set the visibility of this component. When false CSS style is set to display\:none
PanelTabSet_visible_DisplayName=
PanelTabSet_width_Description=Width of the entire tab set. If this value is set and the actual width needed to display all contained tabs is greater than this value, then the tab set will be clipped.
PanelTabSet_width_DisplayName=

