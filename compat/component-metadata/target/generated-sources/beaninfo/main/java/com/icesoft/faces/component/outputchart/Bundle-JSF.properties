# OutputChart
OutputChart_Description=creates chart
OutputChart_DisplayName=Output Chart
OutputChart_actionListener_Description=MethodBinding representing an action listener method that will be notified when this component is activated by the user. The expression must evaluate to a public method that takes an ActionEvent parameter, with a return type of void.
OutputChart_actionListener_DisplayName=
OutputChart_action_Description=MethodBinding representing the application action to invoke when this component is activated by the user. The expression must evaluate to a either a String or a public method that takes no parameters, and returns a String (the logical outcome) which is passed to the NavigationHandler for this application.
OutputChart_action_DisplayName=
OutputChart_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
OutputChart_attributes_DisplayName=Attributes Map
OutputChart_chartTitle_Description=Title for the component. The value of this attribute can be defined on the page or can be bound to the backing bean as String type.
OutputChart_chartTitle_DisplayName=
OutputChart_childCount_Description=The number of child components associated with this component.
OutputChart_childCount_DisplayName=Child Component Count
OutputChart_children_Description=A mutable List of the child components associated with this component.
OutputChart_children_DisplayName=Child Component List
OutputChart_colors_Description=<p> The value of this attribute can be defined on page or can be defined using the backing bean, the valid types for the bean is\: <ul> <li> String array</li> <li> List of java.awt.Color</li> </ul> </p>
OutputChart_colors_DisplayName=
OutputChart_data_Description=<p> Data of the chart. The valud of this attribute can be defined on page or can be bound to the backing bean\:</br> <b>(e.g.) defining on page</b> <pre> &lt;ice\:outputChart type\="pie2d" labels\="pass, fail" data\="70, 30" colors\="green, red"/&gt; dataset can be defined using the colon "\:" &lt;ice\:outputChart type\="barstacked" labels\="pass, fail" data\="70, 30, 10 \: 10, 50, 70" colors\="green, red"/&gt; </pre><br/> This attribute's value has correlation with the labels and color attribute. <br/> if the value bounded with backing bean\: <ul> <li>double or 2d double array</li> <li>List of double or 2d double array</li> </ul> </p>
OutputChart_data_DisplayName=
OutputChart_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
OutputChart_facets_DisplayName=Facets Map
OutputChart_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
OutputChart_family_DisplayName=Component Family
OutputChart_height_Description=Height of the chart. The value of this attribute can be defined on the page or can be bound to the backing bean as String type.
OutputChart_height_DisplayName=
OutputChart_horizontal_Description=<p> This attribute is valid only for the following types of charts\: <ul> <li>bar</li> <li>barclustered</li> <li>barstacked</li> </ul> <b>Note\: </b> Negative values in Stacked Bar charts are not supported by the krysalis.jcharts. </p>
OutputChart_horizontal_DisplayName=
OutputChart_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
OutputChart_id_DisplayName=
OutputChart_immediate_Description=Flag indicating that this component's value must be converted and validated immediately (that is, during Apply Request Values phase), rather than waiting until Process Validations phase.
OutputChart_immediate_DisplayName=
OutputChart_labels_Description=<p> Legend label of the chart. This attribute can be used for any type of chart. The value of the labels attribute has correlation with the data and colors attribute. <br/> When used with pie2D and pie3D the number of values should be same for the labels, data and color attributes. (e.g.) <pre> &lt;ice\:outputChart type\="pie2d" labels\="pass, fail" data\="70, 30" colors\="green, red"/&gt; </pre> When used with other charts except pie, then each labels' value should be mapped with a dataset. A dataset can be indicated by the colon "\:" (e.g.) <pre> &lt;ice\:outputChart type\="barstacked" labels\="pass, fail" data\="70, 30, 10\: 10, 50, 70" colors\="green, red"/&gt; </pre> The value of labels attribute can be defined on the page\: <ul> <li> a single word </li> <li> comma separated values </li> </ul> The value of labels attribute can be defined using the backing bean\: <ul> <li> as String array </li> <li> as List of strings </li> </ul> </p>
OutputChart_labels_DisplayName=
OutputChart_legendColumns_Description=<p> The number of columns for legend label. <pre> (e.g.) To show legend columns vertically &lt;ice\:outputChart type\="barstacked" labels\="pass, fail" data\="70, 30, 10\: 10, 50, 70" colors\="green, red" legendPlacement\="right" legendColumns\="1"/&gt; </pre> </p>
OutputChart_legendColumns_DisplayName=
OutputChart_legendPlacement_Description=<p>The placement of legend label can be set to one of the following\: <ul> <li>top</li> <li>bottom (default)</li> <li>left</li> <li>right</li> <li>none</li> </ul> <pre> (e.g.) &lt;ice\:outputChart type\="barstacked" labels\="pass, fail" data\="70, 30, 10\: 10, 50, 70" colors\="green, red" legendPlacement\="right"/&gt; </pre> Note\: This attribute does not apply to pie3D charts. When the chart type is "custom", remember to read this attribute in your custom charting code and set the chart legend placement accordingly. </p>
OutputChart_legendPlacement_DisplayName=
OutputChart_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
OutputChart_parent_DisplayName=Parent Component
OutputChart_renderOnSubmit_Description=<p> The renderOnSubmit attribute lets the developer decide when to render the chart. However the chart component ensures that the chart image would be generated for first rendering phase but subsequent rendering of the chart would be based on this attribute's value.<br/> The value of this attribute can be defined on the page or can be bound to the backing bean as method binding. <pre> &lt;ice\:outputChart renderOnSubmit\="true"/&gt; or &lt;ice\:outputChart renderOnSubmit\="\#{bean.render}"/&gt; method's signature\: public boolean render(OutputChart component) </pre> </p>
OutputChart_renderOnSubmit_DisplayName=
OutputChart_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
OutputChart_rendered_DisplayName=
OutputChart_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
OutputChart_rendererType_DisplayName=Renderer Type
OutputChart_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
OutputChart_rendersChildren_DisplayName=Renders Children
OutputChart_shapes_Description=<p> This attribute can be used with the line and point chart. <br/> The following are the valid values\: <ul> <li>circle</li> <li>diamond</li> <li>square</li> <li>triangle</li> </ul> The value of this attribute can be defined on page or can be defined using the backing bean, the valid types for the bean is\: <ul> <li> String array containging above strings</li> <li> List of java.awt.Shape</li> </ul> </p>
OutputChart_shapes_DisplayName=
OutputChart_styleClass_Description=Space-separated list of CSS style class(es) to be applied when this element is rendered. This value is passed through as the "class" attribute on generated markup. The base name for all style classes. Default value is <b>iceOutChrt</b> if enabled and <b>iceOutChrt-dis</b> if disabled.
OutputChart_styleClass_DisplayName=
OutputChart_style_Description=CSS style(s) to be applied when this component is rendered.
OutputChart_style_DisplayName=
OutputChart_type_Description=<p>Type of the chart. The valid values are as follows\: <ul> <li>area</li/> <li>areastacked</li/> <li>bar</li/> <li>barclustered</li/> <li>barstacked</li/> <li>line</li/> <li>pie2D</li/> <li>pie3D</li/> <li>point</li/> <li>stock</li/> <li>custom</li/> </ul> Only one type can be set at a time. The value of this attribute can be defined on the page or can be bound to the backing bean as String type. </p>
OutputChart_type_DisplayName=
OutputChart_value_Description=The current value of this component.
OutputChart_value_DisplayName=Value
OutputChart_width_Description=Width of the chart. The value of this attribute can be defined on the page or can be bound to the backing bean as String type.
OutputChart_width_DisplayName=
OutputChart_xaxisLabels_Description=<p> This attribute can be used with all types of charts except pie2D and pie3D. Each value of xaxisLabels is connected with a dataset. It can be defined on page or bound to the backing bean. (e.g.) <pre> &lt;ice\:outputChart type\="barstacked" labels\="pass, fail" data\="70, 30, 10 \: 10, 50, 70" colors\="green, red" xaxisLabels\="2001, 2002, 2003" /&gt; </pre> </p>
OutputChart_xaxisLabels_DisplayName=
OutputChart_xaxisTitle_Description=Title for x axis of the chart. Valid for all types of charts except pie2D and pie3D. The value of this attribute can be defined on the page or can be bound to the backing bean as String type.
OutputChart_xaxisTitle_DisplayName=
OutputChart_yaxisTitle_Description=Title for y axis of the chart. Valid for all types of charts except pie2D and pie3D. The value of this attribute can be defined on the page or can be bound to the backing bean as String type.
OutputChart_yaxisTitle_DisplayName=
