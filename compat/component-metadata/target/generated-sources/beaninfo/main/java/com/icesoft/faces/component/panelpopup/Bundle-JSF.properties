# PanelPopup
PanelPopup_Description=Provides a moveable or modal popup panel that hovers on top of the page
PanelPopup_DisplayName=Panel Popup
PanelPopup_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
PanelPopup_attributes_DisplayName=Attributes Map
PanelPopup_autoCentre_Description=Used to keep the popup centred on the screen through scrolling and window resizing events.
PanelPopup_autoCentre_DisplayName=
PanelPopup_autoPosition_Description=Used to keep the popup positioned on the screen through scrolling events. Use a string of x and y px values (e.g. autoPostion\="35,200"). For a modal popup, use "manual" to disable automatic centering on the document. Then specify top, left positions by style or styleClass.
PanelPopup_autoPosition_DisplayName=
PanelPopup_childCount_Description=The number of child components associated with this component.
PanelPopup_childCount_DisplayName=Child Component Count
PanelPopup_children_Description=A mutable List of the child components associated with this component.
PanelPopup_children_DisplayName=Child Component List
PanelPopup_clientOnly_Description=Sends update to the server on drop event if false. Default value is false.
PanelPopup_clientOnly_DisplayName=
PanelPopup_draggable_Description=When set to 'true' this panel is draggable. The user will be able to drag the panel to any position on the page. Note\: all Draggable panels must be contained in a form.
PanelPopup_draggable_DisplayName=
