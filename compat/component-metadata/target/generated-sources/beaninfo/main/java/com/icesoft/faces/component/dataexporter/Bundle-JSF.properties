DataExporter_Description=
DataExporter_DisplayName=Output Resource
DataExporter_attributes_Description=
DataExporter_attributes_DisplayName=
DataExporter_childCount_Description=
DataExporter_childCount_DisplayName=
DataExporter_children_Description=
DataExporter_children_DisplayName=
DataExporter_clickToCreateFileText_Description=Note\: This is deprecated as of 1.8.1. Specifying a value for this attribute will have no effect.
DataExporter_clickToCreateFileText_DisplayName=
DataExporter_facets_Description=
DataExporter_facets_DisplayName=
DataExporter_family_Description=
DataExporter_family_DisplayName=
DataExporter_for_Description=ID of the dataTable that this dataExporter component will export data from.
DataExporter_for_DisplayName=
DataExporter_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
DataExporter_id_DisplayName=
DataExporter_ignorePagination_Description=This is false by default. If true the dataExporter will ignore the "first" and "rows" properties on the associated dataTable.
DataExporter_ignorePagination_DisplayName=
DataExporter_image_Description=The URL of an image that will be rendered instead of the 'label' attribute text which the user can click on to initiate a data export download. When this attribute is specified, the 'label' text will be used for the 'title' and 'alt' text on the image element.
DataExporter_image_DisplayName=
DataExporter_includeColumns_Description=<p>This attribute lets you define the order and number of columns that needs to be added to the generated output. It takes comma separated column indexes. Note that index starts with 0. <br/><br/> If there are 6 columns in the table and you want to add only 1st, 4th and 6th column to the generated output\:<br/> &lt;ice\:dataExporter includeColumns\="0,3,5"... &gt; <br/> The column order of the above example can be changed a well\:</br> &lt;ice\:dataExporter includeColumns\="5,0,3"... &gt; <br/> By default all columns will be included to the output, and in the default order. </p>
DataExporter_includeColumns_DisplayName=
DataExporter_label_Description=The value of this attribute will be rendered to download the generated file. If it has not been defined then the file name will be rendered instead. If the image property has been specified, then the label will be used to render alt and title attributes on the HTML markup.
DataExporter_label_DisplayName=
DataExporter_outputTypeHandler_Description=Custom output handler can be define using this attribute. The custom handler must be a type of com.icesoft.faces.component.dataexporter.OutputTypeHandler
DataExporter_outputTypeHandler_DisplayName=
DataExporter_parent_Description=
DataExporter_parent_DisplayName=
DataExporter_popupBlockerLabel_Description=<p> When used in a browser with a popup blocker enabled downloading the exported file will require two clicks instead of a single click. In this case the value of this attribute will be used to update the label for the dataExporter to reflect that the user must click the link/button/image again to complete the download process.. </p>
DataExporter_popupBlockerLabel_DisplayName=
DataExporter_renderLabelAsButton_Description=This is false by default. If true the label text will be the label of a rendered button, instead of an anchor link.
DataExporter_renderLabelAsButton_DisplayName=
DataExporter_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
DataExporter_rendered_DisplayName=
DataExporter_rendererType_Description=
DataExporter_rendererType_DisplayName=
DataExporter_rendersChildren_Description=
DataExporter_rendersChildren_DisplayName=
DataExporter_styleClass_Description=<p> Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup.<br/> Default value is <b>iceDatExp<b/></p>
DataExporter_styleClass_DisplayName=
DataExporter_style_Description=CSS style(s) to be applied when this component is rendered.
DataExporter_style_DisplayName=
DataExporter_type_Description=<p> It can have one of the following value\: <ul> <li>excel</li> <li>csv</li> <li>pdf</li> </ul> <b>Note\:</b> If the custom handler has been defined using the <i>outputTypeHandler</i> attribute then it will take precedence over this attribute. Exporting to PDF requires the presence of the iText jar in your application, which can be downloaded from itextpdf.com </p>
DataExporter_type_DisplayName=
