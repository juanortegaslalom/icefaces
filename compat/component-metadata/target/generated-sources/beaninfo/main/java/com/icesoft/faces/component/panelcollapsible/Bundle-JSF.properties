PanelCollapsible_styleClass_Description=<p> Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup.<br/> The base name for all style classes. Default value is <b>icePnlClpsbl</b></p> The class names for the panel, the header, and the content are\:<br> Expanded <ul> <li>icePnlClpsbl</li> <li>icePnlClpsblHdr</li> <li>icePnlClpsblCnt</li> </ul> Collapsed <ul> <li>icePnlClpsblColpsd</li> <li>icePnlClpsblColpsdHdr</li> <li>icePnlClpsblColpsdCnt</li> </ul> Expanded and disabled <ul> <li>icePnlClpsbl-dis</li> <li>icePnlClpsblHdr-dis</li> <li>icePnlClpsblCnt-dis</li> </ul> Collapsed and disabled <ul> <li>icePnlClpsblColpsd-dis</li> <li>icePnlClpsblColpsdHdr-dis</li> <li>icePnlClpsblColpsdCnt-dis</li> </ul> </p>
