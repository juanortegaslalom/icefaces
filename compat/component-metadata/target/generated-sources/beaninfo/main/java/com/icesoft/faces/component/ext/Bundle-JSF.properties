# RowSelector
RowSelector_Description=enables row selection for dataTable
RowSelector_DisplayName=Row Selector
RowSelector_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
RowSelector_attributes_DisplayName=Attributes Map
RowSelector_childCount_Description=The number of child components associated with this component.
RowSelector_childCount_DisplayName=Child Component Count
RowSelector_children_Description=A mutable List of the child components associated with this component.
RowSelector_children_DisplayName=Child Component List
RowSelector_clickAction_Description=<p> Action method to call when a row is clicked or double-clicked. </p>
RowSelector_clickAction_DisplayName=
RowSelector_clickListener_Description=<p> Listener method to call with a ClickActionEvent when a row is clicked or double-clicked. This listener is fired independently of selectionListener. The ClickActionEvent object contains a reference to a RowSelectorEvent if the click or double click resulted in (de)selection of the row, otherwise it will be null. ClickActionEvent.isDblClick() determines whether the click event was a single click or a double click. </p>
RowSelector_clickListener_DisplayName=
RowSelector_clickedRow_Description=<p> The table row that was last clicked. Setting this to some value will not effect row selection. </p>
RowSelector_clickedRow_DisplayName=
RowSelector_dblClickDelay_Description=<p> The delay or timeout in milliseconds to wait for a second click (after a first click has been made on a row) to notify the server whether the ClickActionEvent was a single click or a double click. This attribute only applies when clickListener and/or clickAction are specified. Valid values are 0 to 1000. Default is 200. </p>
RowSelector_dblClickDelay_DisplayName=
RowSelector_enhancedMultiple_Description=<p> When enhancedMultiple is true, it allows following selection behaviour\: <ul> <li> "Click" selects clicked row and deselects rest </li> <li> "Click + Ctrl" flip the selection of clicked row and keeps previous selection intact</li> <li> "Click + Shift" selects all rows from last clicked row to newly clicked row, and deselect rest</li> <li> "Click + Shift + Ctrl" selects all rows from last clicked row to newly clicked row and keeps previous selection intact</li> </ul> </p>
RowSelector_enhancedMultiple_DisplayName=
RowSelector_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
RowSelector_facets_DisplayName=Facets Map
RowSelector_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
RowSelector_family_DisplayName=Component Family
RowSelector_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
RowSelector_id_DisplayName=
RowSelector_immediate_Description=<p>If true, the selectionListener and selectionAction will be executed immediately, during Apply Request Values phase of the request processing lifecycle, and if false, during the Invoke Application phase. The default value is true, for backwards compatibility.</p>
RowSelector_immediate_DisplayName=
RowSelector_keyboardNavigationEnabled_Description=<p> Enables keyboard support. Default value is true. When true it enables "up" and "down" arrow keys to set the focus on rows, as it was hovered by the mouse. Once row has a focus then it can be selected/deselected by hitting the "space" or "enter" key</p>
RowSelector_keyboardNavigationEnabled_DisplayName=
RowSelector_mouseOverClass_Description=<p> This method has been deprecated in 1.6. Please use the styleClass instead. </p>
RowSelector_mouseOverClass_DisplayName=
RowSelector_multiple_Description=<p> When true, more then one row can be selected. Default is false. </p>
RowSelector_multiple_DisplayName=
RowSelector_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
RowSelector_parent_DisplayName=Parent Component
RowSelector_preStyleOnSelection_Description=<p> When the user (de)selects a row, there can be a latency with the network communication with the server, and the JSF lifecycle executing, before the client will be updated to depict the row selection. When <b>preStyleOnSelection</b> is true, the table row's styling will be updated immediately, improving the application's perceived responsiveness. When applications directly manage row selection, on the server side, to implement specific rules for (de)selection, they should see this to false, to avoid styling being set and reset. For backwards compatibility with such applications, the default value is false.</p>
RowSelector_preStyleOnSelection_DisplayName=
RowSelector_renderedOnUserRole_Description=If user is in given role, this component will be rendered normally. If not, nothing is rendered and the body of this tag will be skipped.
RowSelector_renderedOnUserRole_DisplayName=
RowSelector_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
RowSelector_rendered_DisplayName=
RowSelector_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
RowSelector_rendererType_DisplayName=Renderer Type
RowSelector_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
RowSelector_rendersChildren_DisplayName=Renders Children
RowSelector_selectedClass_Description=<p> This method has been deprecated in 1.6. Please use the styleClass instead. </p>
RowSelector_selectedClass_DisplayName=
RowSelector_selectedMouseOverClass_Description=<p> This method has been deprecated in 1.6. Please use the styleClass instead. </p>
RowSelector_selectedMouseOverClass_DisplayName=
RowSelector_selectionAction_Description=<p> Action method to call when a row is clicked </p>
RowSelector_selectionAction_DisplayName=
RowSelector_selectionListener_Description=<p> Listener method to call with a RowSelectorEvent when a row is (de)selected </p>
RowSelector_selectionListener_DisplayName=
RowSelector_singleRowAutoSelect_Description=<p>When true selects rows automatically on arrow key events in single selection mode</p>
RowSelector_singleRowAutoSelect_DisplayName=
RowSelector_styleClass_Description=<p> Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup.<br/> Default value is <b>iceRowSel</b>\:<br/> Style Classes Used\: <ul> <li>iceRowSelMouseOver</li> <li>iceRowSelSelected</li> <li>iceRowSelSelectedMouseOver</li> </ul> </p>
RowSelector_styleClass_DisplayName=
RowSelector_tabindex_Description=Position of this element in the tabbing order for the current document. This value must be an integer between 0 and 32767.
RowSelector_tabindex_DisplayName=
RowSelector_toggleOnClick_Description=<p> Do row selection on mouse click. When false, row (de)selection will not happen when the user clicks on a table row. Default value is true. </p>
RowSelector_toggleOnClick_DisplayName=
RowSelector_toggleOnInput_Description=<p> Do row selection, even when the user clicks on an input field or link in a table cell. Default value is true. When false, row (de)selection will not happen when the user clicks inside an input field, list, menu, button, or link.</p>
RowSelector_toggleOnInput_DisplayName=
RowSelector_value_Description=<p>A ValueBinding to a per dataTable row java.lang.Boolean property, which determines if that row is selected. Typically the ValueBinding refers to a property of the dataTable's <i>var</i> attribute, but another strategy is to use a smart java.util.Map to centrally maintain the selection state.</p>
RowSelector_value_DisplayName=

