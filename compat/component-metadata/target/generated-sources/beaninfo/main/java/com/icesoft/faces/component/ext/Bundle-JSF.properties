HtmlDataTable_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
HtmlDataTable_rendersChildren_DisplayName=Renders Children
HtmlDataTable_resizableColumnWidths_Description=A comma separated list of the widths of each column for a resizable table. Please note that column widths must be set in pixels. This attribute does not yet support percentage column widths.
HtmlDataTable_resizableColumnWidths_DisplayName=
HtmlDataTable_resizable_Description=<p> To make columns resizable, this attribute needs to be true. </p> <b>Note\: </b> Only those columns of the table can be dragged which are defined as the "header" facet of a column. The headers which are defined by the "columnGroup" can not be dragged. <p> This feature does not yet support dataTables with the 'scrollable' attribute set. This combination of features is slated for a future release. </p>
HtmlDataTable_resizable_DisplayName=
HtmlDataTable_rowAvailable_Description=Flag indicating whether there is model data available for the row selected by the current value of the "rowIndex" property.
HtmlDataTable_rowAvailable_DisplayName=Row Available Flag
HtmlDataTable_rowClasses_Description=<p> Comma-delimited list of CSS style classes that will be applied to the rows of this table. A space separated list of classes may also be specified for any individual row. Thes styles are applied, in turn, to each row in the table. For example, if the list has two elements, the first style class in the list is applied to the first row, the second to the second row, the first to the third row, the second to the fourth row, etc. In other words, we keep iterating through the list until we reach the end, and then we start at the beginning again. <br/> The default classes rendered as <b>iceDatTblRow1, iceDatTblRow2</b> alternatively. </p>
HtmlDataTable_rowClasses_DisplayName=
HtmlDataTable_rowCount_Description=The number of rows of model data that are available for processing by this component. If the number of rows is unknown, this property will be set to -1.
HtmlDataTable_rowCount_DisplayName=Row Count
HtmlDataTable_rowData_Description=An object representing the model data for the row selected by the current value of the "rowIndex" property.
HtmlDataTable_rowData_DisplayName=Row Data
HtmlDataTable_rowIndex_Description=Zero-relative index of the currently selected row from the underlying model data. No error will occur if this property is set to point at a row for which no model data exists. To ensure data availability, check the state of the "rowAvailable" property after modifying this property.
HtmlDataTable_rowIndex_DisplayName=Row Index
HtmlDataTable_rowStatePreserved_Description=<span class\="changed_added_2_1">Boolean flag directing how the per-row component state should be handled.</span>
HtmlDataTable_rowStatePreserved_DisplayName=Preserve Row Component State
HtmlDataTable_rows_Description=The number of rows to display, starting with the one identified by the "first" property. If this value is set to zero, all available rows in the underlying data model will be displayed.
HtmlDataTable_rows_DisplayName=
HtmlDataTable_rules_Description=Code specifying which rules will appear between cells within this table. Valid values are\: none (no rules, default value); groups (between row groups); rows (between rows only); cols (between columns only); and all (between all rows and columns).
HtmlDataTable_rules_DisplayName=
HtmlDataTable_scrollFooter_Description=In scrollable mode the footer scrolls as well, to trun the scrolling off it can be set to the false. The default value is true.
HtmlDataTable_scrollFooter_DisplayName=
HtmlDataTable_scrollHeight_Description=Set the height of the scroll table.
HtmlDataTable_scrollHeight_DisplayName=
HtmlDataTable_scrollable_Description=When true table is scrollable. (Note\: you will also need to set columnWidths, and scrollHeight) When table is scrollable pass-thru attributes like bgcolor will not work because they are passed to the outer scrollable div only, not to the table itself. Use style classes instead. See the styleClass, rowClasses and columnClasses attributes.
HtmlDataTable_scrollable_DisplayName=
HtmlDataTable_sortAscending_Description=Sets default sort order, required for sortheader component.
HtmlDataTable_sortAscending_DisplayName=
HtmlDataTable_sortColumn_Description=Sets column to be sort, required for sortheader component.
HtmlDataTable_sortColumn_DisplayName=
HtmlDataTable_styleClass_Description=<p> Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup. the default class rendered as <b>iceDatTbl</b>. if enabled <ul> <li>iceDatTbl</li> <li>iceDatTblCol</li> <li>iceDatTblCol1</li> <li>iceDatTblCol2</li> <li>iceDatTblColHdr</li> <li>iceDatTblColHdr1</li> <li>iceDatTblColHdr2</li> <li>iceDatTblRow1</li> <li>iceDatTblRow2</li> <li>iceDatTblHdr</li> <li>iceDatTblFtr</li> <li>iceDatTblScrlHdrTbl</li> <li>iceDatTblScrlBdyTbl</li> </ul> The following style class is being rendered for the div of the "header" if the dataTable is scrollable. <ul> <li>iceDatTblScrlSpr</li> </ul> The following style class is being rendered for active sortable column header. <ul> <li>iceDatTblActvSrtHdr</li> </ul> </p>
HtmlDataTable_styleClass_DisplayName=
HtmlDataTable_style_Description=CSS style(s) to be applied when this component is rendered.
HtmlDataTable_style_DisplayName=
HtmlDataTable_summary_Description=Summary of this table's purpose and structure, for user agents rendering to non-visual media such as speech and Braille.
HtmlDataTable_summary_DisplayName=
HtmlDataTable_title_Description=Advisory title information about markup elements generated for this component.
HtmlDataTable_title_DisplayName=
HtmlDataTable_value_Description=The data model for this component.
HtmlDataTable_value_DisplayName=
HtmlDataTable_varStatus_Description=<p>Name of a request-scope attribute under which the current indexed state will be exposed. This is modeled after the Facelets JSTL c\:forEach varStatus. The varStatus object has 5 sub-properties\:</p> <dl> <dt>int <b>begin</b></dt> <dd>Corresponds to the UIData container's <b>first</b> property, the index at which it begins iteration.</dd> <dt>int <b>end</b></dt> <dd>The ending index of iteration, corresponding to the UIData container's <b>first</b> plus <b>rows</b> minus 1. Note\: If the UIData's DataModel's isRowAvailable() method returns false, prematurely ending iteration, then the actual ending index may not equal the value for this <b>end</b> property.</dd> <dt>int <b>index</b></dt> <dd>The current iteration index. Corresponding to the UIData container's getRowIndex() value, which also corresponds with the UIData's DataModel's getRowIndex() value.</dd> <dt>boolean <b>first</b></dt> <dd>Defined simply as\: <b>varStatus.index \=\= varStatus.begin</b></dd> <dt>boolean <b>last</b></dt> <dd>Defined simply as\: <b>varStatus.index \=\= varStatus.end</b>. Note\: This has the same limitations as the <b>end</b> property.</dd>
HtmlDataTable_varStatus_DisplayName=
HtmlDataTable_var_Description=Name of a request-scope attribute under which the model data for the row selected by the current value of the "rowIndex" property (i.e. also the current value of the "rowData" property) will be exposed.
HtmlDataTable_var_DisplayName=
HtmlDataTable_width_Description=Width of the entire table, for visual user agents.
HtmlDataTable_width_DisplayName=

