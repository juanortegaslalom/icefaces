# HtmlDataTable
HtmlDataTable_Description=Provides a tabular view of a UIData structure
HtmlDataTable_DisplayName=Data Table
HtmlDataTable_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
HtmlDataTable_attributes_DisplayName=Attributes Map
HtmlDataTable_bgcolor_Description=Name or code of the background color for this table.
HtmlDataTable_bgcolor_DisplayName=
HtmlDataTable_bodyrows_Description=Comma separated list of row indices for which a new "tbody" element should be started (and any previously opened one should be ended).
HtmlDataTable_bodyrows_DisplayName=Body Rows
HtmlDataTable_border_Description=Width (in pixels) of the border to be drawn around this table.
HtmlDataTable_border_DisplayName=
HtmlDataTable_captionClass_Description=Space-separated list of CSS style class(es) that will be applied to any caption generated for this table.
HtmlDataTable_captionClass_DisplayName=Caption CSS Classes
HtmlDataTable_captionStyle_Description=CSS style(s) to be applied when this caption is rendered.
HtmlDataTable_captionStyle_DisplayName=Caption CSS Styles
HtmlDataTable_cellpadding_Description=Definition of how much space the user agent should leave between the border of each cell and its contents.
HtmlDataTable_cellpadding_DisplayName=
HtmlDataTable_cellspacing_Description=Definition of how much space the user agent should leave between the left side of the table and the leftmost column, the top of the table and the top of the top side of the topmost row, and so on for the right and bottom of the table. It also specifies the amount of space to leave between cells.
HtmlDataTable_cellspacing_DisplayName=
HtmlDataTable_childCount_Description=The number of child components associated with this component.
HtmlDataTable_childCount_DisplayName=Child Component Count
HtmlDataTable_children_Description=A mutable List of the child components associated with this component.
HtmlDataTable_children_DisplayName=Child Component List
HtmlDataTable_clientOnly_Description=If false, saves the width of the columns to the server, its only applicable when resizeable \= true. "true" is the default value. It helps when the width of the column needs to be preserved after the resize operation.
HtmlDataTable_clientOnly_DisplayName=
HtmlDataTable_columnClasses_Description=<p> Comma-delimited list of CSS style classes that will be applied to the columns of this table. A space separated list of classes may also be specified for any individual column. If the number of elements in this list is less than the number of columns specified in the "columns" attribute, no "class" attribute is output for each column greater than the number of elements in the list. If the number of elements in the list is greater than the number of columns specified in the "columns" attribute, the elements at the posisiton in the list after the value of the "columns" attribute are ignored. </p> <p> If the value of this attribute is not being set, the tableRenderer would render the default classes using the following pattern (e.g.) <br/> &lt;td class\="iceDatTblCol1" /&gt; <br/> &lt;td class\="iceDatTblCol2" /&gt; <br/> &lt;td class\="iceDatTblCol1" /&gt; <br/> &lt;td class\="iceDatTblCol2" /&gt; <br/> .... </p> <p> The above class pattern would allow you to define the base style in the "column" class and if you want to customize any of the specific column you can override the column+index class. </p>
HtmlDataTable_columnClasses_DisplayName=
HtmlDataTable_columnWidths_Description=A comma separated list of the widths of each column for a scrollable table. Please note that column widths must be set in pixels. This attribute does not yet support percentage column widths.
HtmlDataTable_columnWidths_DisplayName=
HtmlDataTable_dir_Description=Direction indication for text that does not inherit directionality. Valid values are "LTR" (left-to-right) and "RTL" (right-to-left).
HtmlDataTable_dir_DisplayName=
HtmlDataTable_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
HtmlDataTable_facets_DisplayName=Facets Map
HtmlDataTable_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
HtmlDataTable_family_DisplayName=Component Family
HtmlDataTable_first_Description=Zero-relative row number of the first row to be displayed. If this property is set to zero, rendering will begin with the first row of the underlying data.
HtmlDataTable_first_DisplayName=
HtmlDataTable_footerClass_Description=<p> Space-separated list of CSS style class(es) that will be applied to any footer generated for this table. <br/> The default classe rendered as <b>iceDatTblFtr</b>. </p>
HtmlDataTable_footerClass_DisplayName=
HtmlDataTable_frame_Description=Code specifying which sides of the frame surrounding this table will be visible. Valid values are\: none (no sides, default value); above (top side only); below (bottom side only); hsides (top and bottom sides only); vsides (right and left sides only); lhs (left hand side only); rhs (right hand side only); box (all four sides); and border (all four sides).
HtmlDataTable_frame_DisplayName=
HtmlDataTable_headerClass_Description=<p> Space-separated list of CSS style class(es) that will be applied to any header generated for this table. <br/> The default class would rendered as <b>iceDatTblHdr</b>. </p>
HtmlDataTable_headerClass_DisplayName=
HtmlDataTable_headerClasses_Description=This attribute can be used to define the separate style classes for the each header of the each column.<br/> The default would rendered as \: iceDatTblColHdr1, iceDatTblColHdr2 alternatively<br/> Note\: The attribute has been deprecated.
HtmlDataTable_headerClasses_DisplayName=
HtmlDataTable_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
HtmlDataTable_id_DisplayName=
HtmlDataTable_lang_Description=Code describing the language used in the generated markup for this component.
HtmlDataTable_lang_DisplayName=
