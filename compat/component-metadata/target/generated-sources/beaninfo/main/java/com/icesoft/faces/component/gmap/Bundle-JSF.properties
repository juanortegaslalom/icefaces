GMap_styleClass_Description=Space-separated list of CSS style class(es) to be applied when this element is rendered. This value must be passed through as the "class" attribute on generated markup. <br/><br/> The base name for all style classes. Default value is iceGmp <ul> <li>iceGmpMapTd (this class will apply on the td, that contains the google map)</li> <li>iceGmpTxtTd (this class will apply on the td, that contains the default textual div used by GDirection component</li> <ul>
GMap_styleClass_DisplayName=
GMap_style_Description=CSS style(s) to be applied when this component is rendered.
GMap_style_DisplayName=
GMap_type_Description=Type of the map. The following are the valid values\: <ul> <li>Satellite</li> <li>Hybrid</li> <li>Map</li> </ul> To render a map in Statellite view\: <br/> &lt;ice\:GMap type\="Satellite" address\="Calgary" /&gt;
GMap_type_DisplayName=
GMap_zoomLevel_Description=Set the zoom level of the map &lt;ice\:GMap zoomLevel\="6" /&gt;
GMap_zoomLevel_DisplayName=
