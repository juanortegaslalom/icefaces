# GMap
GMap_Description=
GMap_DisplayName=gMap
GMap_address_Description=The ice\:gMap component can locate an address on the map, using the GClientGeocoder implicitly. <br/>(e.g.) To render a map with the default location.<br/> &lt;ice\:gMap address\="Calgary"/&gt; <br/><br/> To locate the address dynamically, the address needs to be bind with the bean and "locateAddress" attribute needs to return "true", when map needs to be located (e.g.)<br/> &lt;ice\:inputText value\="\#{gmap.address}" valueChangeListener\="\#{gmap.addressChanged}" /&gt;<br/> &lt;ice\:gMap address\="\#{gmap.address}" locateAddress\="\#{gmap.locateAddress}"/&gt;<br/><br/> Note\: The valueChangeListener sets the value of the "locateAddress" to true of false, that causes the address to be locate on the google map.
GMap_address_DisplayName=
GMap_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
GMap_attributes_DisplayName=Attributes Map
GMap_childCount_Description=The number of child components associated with this component.
GMap_childCount_DisplayName=Child Component Count
GMap_children_Description=A mutable List of the child components associated with this component.
GMap_children_DisplayName=Child Component List
GMap_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
GMap_facets_DisplayName=Facets Map
GMap_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
GMap_family_DisplayName=Component Family
GMap_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
GMap_id_DisplayName=
GMap_latitude_Description=The latitude of the Map
GMap_latitude_DisplayName=
GMap_locateAddress_Description=This attribute tells to the map to locate the address if set to true.
GMap_locateAddress_DisplayName=
GMap_longitude_Description=The longitude of the Map
GMap_longitude_DisplayName=
GMap_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
GMap_parent_DisplayName=Parent Component
GMap_renderedOnUserRole_Description=If user is in given role, this component will be rendered normally. If not, nothing is rendered and the body of this tag will be skipped.
