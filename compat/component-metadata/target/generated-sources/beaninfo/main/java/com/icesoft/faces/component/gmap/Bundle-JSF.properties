GMapControl_rendererType_DisplayName=Renderer Type
GMapControl_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
GMapControl_rendersChildren_DisplayName=Renders Children

