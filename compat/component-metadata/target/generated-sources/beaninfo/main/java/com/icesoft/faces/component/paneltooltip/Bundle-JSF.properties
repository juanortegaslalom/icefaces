PanelTooltip_displayListener_Description=The displayListener is a MethodBinding/MethodExpression that specifies a method on a backing bean that will accept a com.icesoft.faces.component.DisplayEvent.
PanelTooltip_displayListener_DisplayName=
PanelTooltip_displayOn_Description=<p> The following are the valid values for the displayOn attribute\: <ul> <li> hover (default)\: cursor hover </li> <li> click\: left mouse button clicked </li> <li> altclick\: right mouse button clicked (tied to the "contextmenu" JS event) </li> <li> dblclick\: double click </li> </ul>
PanelTooltip_displayOn_DisplayName=
PanelTooltip_draggable_Description=When set to 'true' this panelTooltip is draggable. The user will be able to drag the panel to any position on the page. Note\: all Draggable panels must be contained in a form. If the panelTooltip is draggable it becomes dynamic automatically.
PanelTooltip_draggable_DisplayName=
