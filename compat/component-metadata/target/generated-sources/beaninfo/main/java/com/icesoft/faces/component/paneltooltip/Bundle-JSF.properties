PanelTooltip_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
PanelTooltip_family_DisplayName=Component Family
PanelTooltip_hideOn_Description=<p> The following are the valid values for the autoHide attribute\: <ul> <li> mouseout </li> <li> mousedown </li> <li> none </li> </ul> </p> <p> <h3> mouseout \:</h3> the tooltip will be hide (un-rdender or invisible, depending on the dynamic attribute) when the user moves the mouse out of the triggering component. </p> <p> <h3> mousedown \:</h3> the tooltip will be hide (un-rdender or invisible, depending on the dynamic attribute) when the user clicks any area outside of the panelTooltip itself is clicked. </p> <p> <h3> none \:</h3> the tooltip will not be hide until the application changes the "visible" attribute to be false<br/> </p>
PanelTooltip_hideOn_DisplayName=
PanelTooltip_hoverDelay_Description=\# of milliseconds that mouse must be continuously hovered over the component before the tooltip is displayed.
