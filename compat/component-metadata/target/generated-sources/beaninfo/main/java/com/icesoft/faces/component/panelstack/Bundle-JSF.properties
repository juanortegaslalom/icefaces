PanelStack_rendererType_Description=Identifier used (in conjunction with the "family" property) to select an appropriate Renderer to encode and decode this component.
PanelStack_rendererType_DisplayName=Renderer Type
PanelStack_rendersChildren_Description=Flag indicating whether or not this component takes responsibility for rendering its own children. This decision is normally delegated to the associated Renderer, if there is one.
PanelStack_rendersChildren_DisplayName=Renders Children
PanelStack_selectedPanel_Description=Id of the child to be rendered.
PanelStack_selectedPanel_DisplayName=
PanelStack_styleClass_Description=<p>Defines the base class name for all style classes. Default value is <b>icePnlStk</b>.</p> <p>Style Classes Used\:</p> <ul> <li>icePnlStk</li> <li>icePnlStkRow</li> <li>icePnlStkCol</li> </ul>
