# PanelStack
PanelStack_Description=Displays only one of many associated child components at a time
PanelStack_DisplayName=Panel Stack
PanelStack_attributes_Description=A mutable Map of the attributes associated with this component, keyed by attribute name.
PanelStack_attributes_DisplayName=Attributes Map
PanelStack_childCount_Description=The number of child components associated with this component.
PanelStack_childCount_DisplayName=Child Component Count
PanelStack_children_Description=A mutable List of the child components associated with this component.
PanelStack_children_DisplayName=Child Component List
PanelStack_facets_Description=A mutable Map of the facets associated with this component, keyed by facet name.
PanelStack_facets_DisplayName=Facets Map
PanelStack_family_Description=The component family to which this component belongs. This property is used to select an appropriate Renderer.
PanelStack_family_DisplayName=Component Family
PanelStack_id_Description=The component identifier for this component. This value must be unique within the closest parent component that is a naming container.
PanelStack_id_DisplayName=
PanelStack_layout_Description=The type of layout markup to use when rendering this group. If the value is "block" the renderer must produce an HTML "div" element. Otherwise HTML "span" element must be produced.
PanelStack_layout_DisplayName=Layout
PanelStack_parent_Description=The parent component for this component. On the root component in the component tree (which must be of type UIViewRoot), this property is null.
PanelStack_parent_DisplayName=Parent Component
PanelStack_renderedOnUserRole_Description=If user is in given role, this component will be rendered normally. If not, nothing is rendered and the body of this tag will be skipped.
PanelStack_renderedOnUserRole_DisplayName=
PanelStack_rendered_Description=Flag indicating whether or not this component should be rendered (during Render Response Phase), or processed on any subsequent form submit.
