spring:
  application:
    name: alberta-staff-directory-api
  
  # Database configuration - Compatible with existing ICEfaces app
  datasource:
    url: jdbc:mysql://mysql-db:3306/employeedb
    username: iceuser
    password: icepass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ModernAppPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  
  # JPA configuration - READ ONLY for compatibility
  jpa:
    hibernate:
      ddl-auto: validate  # Never modify existing schema
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
    open-in-view: false
  
  # Profiles for different environments
  profiles:
    active: docker

# Server configuration
server:
  port: 8080
  servlet:
    context-path: /api

# Logging configuration
logging:
  level:
    ca.alberta.gov.staffdirectory: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha

---
# Development profile (for local development without Docker)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/employeedb

---
# Docker profile (default for containerized deployment)
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql-db:3306/employeedb