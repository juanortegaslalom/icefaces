<!-- ICEfaces Modernization - Angular Frontend -->
<div class="app-container">
  <mat-toolbar color="primary" class="app-toolbar">
    <mat-icon>rocket_launch</mat-icon>
    <span class="app-title">ICEfaces Modernization</span>
    <span class="spacer"></span>
    
    <!-- Navigation Links -->
    <button mat-button routerLink="/dashboard" routerLinkActive="active-link">
      <mat-icon>dashboard</mat-icon>
      Dashboard
    </button>
    <button mat-button routerLink="/cars" routerLinkActive="active-link">
      <mat-icon>directions_car</mat-icon>
      Cars
    </button>
    <button mat-button routerLink="/cities" routerLinkActive="active-link">
      <mat-icon>location_city</mat-icon>
      Cities
    </button>
    <button mat-button routerLink="/employees" routerLinkActive="active-link">
      <mat-icon>people</mat-icon>
      Employees
    </button>
    
    <span class="app-subtitle">Angular + Spring Boot</span>
  </mat-toolbar>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <p>ICEfaces to Angular + Spring Boot Modernization | Phases 1-5 Complete ✅</p>
  </footer>
</div>
